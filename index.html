<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MathStudio Pro - Entorno Matemático & Mallas 3D</title>

    <!-- Librerías de Cálculo y Gráficas -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mathjs/11.8.0/math.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/plotly.js/2.18.2/plotly.min.js"></script>

    <style>
        :root {

            --bg-panel: #202020;

            --border: #303030;
            --text: #e0e0e0;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: var(--bg-main);

            height: 100vh;

        #app-tab-header {

            padding: 8px 16px;
            background: #1a1a1a;
            border-bottom: 1px solid var(--border);
            overflow-x: auto;

        }
        #app-tab-header::-webkit-scrollbar { height: 4px; }

        .app-brand {
            font-size: 14px;
            font-weight: 700;
            color: var(--accent);
            white-space: nowrap;

            flex: 1;

            padding: 16px;

        }

        .module-view {
            display: none;

        .module-view.active {
            display: grid;
            gap: 16px;
            grid-template-columns: minmax(390px, 460px) 1fr;

<body>

    <header id="app-tab-header">
        <div class="app-brand">
            <span class="material-symbols-outlined">view_in_ar</span>
            <span>MathStudio 3D Mesh</span>
        </div>
        <div id="tab-buttons-mount" style="display: flex; gap: 8px;"></div>

    <main id="app-workspace"></main>

<script>
// =============================================================================
// FUNCIÓN AUXILIAR DE PLOTEO SEGURO (CON AUTO-RECUPERACIÓN DE WEBGL)
// =============================================================================
function safePlot(div, data, layout) {
    if (!div || div.clientWidth < 10 || div.clientHeight < 10) return;
    try {
        Plotly.react(div, data, layout, { responsive: true, displayModeBar: false });
    } catch (err) {
        console.warn("Recuperando contexto WebGL...", err);
        try {
            Plotly.purge(div);
            Plotly.newPlot(div, data, layout, { responsive: true, displayModeBar: false });
        } catch(e) {
            console.error("Fallo crítico en WebGL:", e);
        }
    }
}

// Normaliza multiplicaciones implícitas como 2x -> 2*x, x y -> x*y
function sanitizeMathExpression(expr) {
    if (!expr || typeof expr !== 'string') return "0";
    let s = expr.trim();
    s = s.replace(/(\d)\s*([a-zA-Z(])/g, '$1*$2');
    s = s.replace(/([a-zA-Z])\s+([a-zA-Z])/g, '$1*$2');
    return s;
}

// =============================================================================
// 1. CLASE MAESTRA DE INTERFAZ GRÁFICA (MathUI)
// =============================================================================
class MathUI {
    constructor() {
        this.headerMount = document.getElementById("tab-buttons-mount");
        this.workspaceMount = document.getElementById("app-workspace");
        this.modules = [];
        this.buttons = [];
        this.activeModuleId = null;

        let resizeTimer = null;
        window.addEventListener("resize", () => {
            clearTimeout(resizeTimer);
            resizeTimer = setTimeout(() => this.handleGlobalResize(), 100);
        });
    }

    registerModule(id, label, iconSvg, moduleInstance) {
        const section = document.createElement("section");
        section.id = `view-${id}`;
        section.className = "module-view";

        const controlsCol = document.createElement("div");
        controlsCol.className = "module-controls-box";

        const graphCol = document.createElement("div");
        graphCol.className = "module-graph-box";

        const plotDiv = document.createElement("div");
        plotDiv.id = `plot-${id}`;
        plotDiv.className = "graph-plotly-target";
        graphCol.appendChild(plotDiv);

        section.appendChild(controlsCol);
        section.appendChild(graphCol);
        this.workspaceMount.appendChild(section);

        const tabBtn = new GiovanniBoton({
            svg: iconSvg,
            texto: label,
            ancho: 170,
            alto: 34,
            position: "static",
            background: "#242424",
            color: "#9e9e9e",
            onClick: () => this.switchTab(id)
        });
        tabBtn.el.style.width = "auto";
        tabBtn.el.style.padding = "0 12px";
        tabBtn.el.style.gap = "6px";
        tabBtn._moduleId = id;
        tabBtn.montar(this.headerMount);
        this.buttons.push(tabBtn);

        moduleInstance.init(controlsCol, plotDiv);
        this.modules.push({ id, section, plotDiv, instance: moduleInstance });

        if (this.modules.length === 1) {
            this.switchTab(id);
        }
    }

    switchTab(moduleId) {
        this.activeModuleId = moduleId;

        this.modules.forEach(m => {
            const isActive = (m.id === moduleId);
            m.section.classList.toggle("active", isActive);
        });

        this.buttons.forEach(btn => {
            const isActive = (btn._moduleId === moduleId);
            btn.setStyle({
                backgroundColor: isActive ? "#5c9ce6" : "#242424",
                color: isActive ? "#ffffff" : "#9e9e9e"
            });
        });

        requestAnimationFrame(() => {
            requestAnimationFrame(() => {
                const current = this.modules.find(m => m.id === moduleId);
                if (current && current.instance && current.instance.render) {
                    current.instance.render();
                }
                this.handleGlobalResize();
            });
        });
    }

    handleGlobalResize() {
        const active = this.modules.find(m => m.id === this.activeModuleId);
        if (active && active.plotDiv && active.plotDiv.clientWidth > 10 && active.plotDiv.clientHeight > 10) {
            Plotly.Plots.resize(active.plotDiv);
        }
    }
}

// =============================================================================
// 2. MÓDULO SUPERFICIES 3D CON PROTECCIÓN TOTAL AL MULTIPLICAR
// =============================================================================
class Superficies3DModule {
    init(controlsContainer, plotElement) {
        this.plotEl = plotElement;
        this.generatedCode = "";
        this.currentExtension = ".py";
        this.debounceTimer = null;

        this.panel = new GiovanniContainerSimple({
            title: "Superficie 3D & Exportador de Malla",
            isOpen: true,
            width: "100%"
        });

        this.inEq = new GiovanniInputText({
            label: "Ecuación z = f(x, y)",
            value: "x * y"
        });
        this.panel.appendChild(this.inEq.element);

        this.sliderRange = new GiovanniSlider({
            label: "Radio del Dominio [-L, L]",
            min: 1,
            max: 15,
            step: 0.5,
            value: 4
        });
        this.panel.appendChild(this.sliderRange.element);

        this.sliderRes = new GiovanniSlider({
            label: "Subdivisiones N",
            min: 8,
            max: 44,
            step: 2,
            value: 24
        });
        this.panel.appendChild(this.sliderRes.element);

        this.selectEngine = new GiovanniSelect({
            label: "Motor / Formato de Exportación",
            options: [
                { label: "Blender 3D (Python Script)", value: "blender" },
                { label: "Godot Engine 4 (GDScript)", value: "godot" },
                { label: "Three.js (JavaScript)", value: "threejs" },
                { label: "Unity Engine (C# MonoBehaviour)", value: "unity" },
                { label: "Unreal Engine 5 (C++ ProceduralMesh)", value: "unreal" },
                { label: "Stride Engine (C# VertexBuffer)", value: "stride" }
            ],
            value: "blender",
            onChange: () => this.generateCode()
        });
        this.panel.appendChild(this.selectEngine.element);

        const rowBtns = document.createElement("div");
        rowBtns.className = "math-row";
        rowBtns.style.marginTop = "8px";

        const iconCopy = `<svg viewBox="0 0 24 24"><path d="M16 1H4c-1.1 0-2 .9-2 2v14h2V3h12V1zm3 4H8c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm0 16H8V7h11v14z"/></svg>`;
        this.btnCopy = new GiovanniBoton({
            svg: iconCopy,
            texto: "Copiar Código",
            ancho: 150,
            alto: 32,
            position: "static",
            onClick: () => this.copyToClipboard()
        });
        this.btnCopy.el.style.width = "100%";

        const iconDownload = `<svg viewBox="0 0 24 24"><path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/></svg>`;
        this.btnDownload = new GiovanniBoton({
            svg: iconDownload,
            texto: "Descargar Script",
            ancho: 150,
            alto: 32,
            position: "static",
            background: "#3b82f6",
            color: "#ffffff",
            onClick: () => this.downloadCodeFile()
        });
        this.btnDownload.el.style.width = "100%";

        rowBtns.appendChild(this.btnCopy.el);
        rowBtns.appendChild(this.btnDownload.el);
        this.panel.appendChild(rowBtns);

        this.resCard = document.createElement("div");
        this.resCard.className = "math-result-card";
        this.panel.appendChild(this.resCard);

        const lblCode = document.createElement("div");
        lblCode.innerHTML = `<span class="math-tag">Código Fuente Generado</span>`;
        lblCode.style.marginTop = "8px";
        this.panel.appendChild(lblCode);

        this.codePreview = document.createElement("pre");
        this.codePreview.className = "code-preview-box";
        this.panel.appendChild(this.codePreview);

        controlsContainer.appendChild(this.panel.element);

        // Control reactivo con Debounce para evitar renderizar en fórmulas incompletas (ej: "x*")
        const triggerUpdate = () => {
            clearTimeout(this.debounceTimer);
            this.debounceTimer = setTimeout(() => {
                this.render();
                this.generateCode();
            }, 200);
        };

        this.inEq.options.onChange = triggerUpdate;
        this.sliderRange.options.onInput = triggerUpdate;
        this.sliderRes.options.onInput = triggerUpdate;

        this.generateCode();
    }

    render() {
        if (!this.plotEl || this.plotEl.clientWidth < 10 || this.plotEl.clientHeight < 10) return;

        const rawEq = this.inEq.getValue();
        const cleanEq = sanitizeMathExpression(rawEq);
        const L = this.sliderRange.getValue();
        const steps = this.sliderRes.getValue();
        const h = (2 * L) / steps;

        // 1. PRE-VALIDACIÓN: Compilar antes de calcular para no romper WebGL si está incompleto
        let compiled = null;
        try {
            compiled = math.compile(cleanEq);
            const test = compiled.evaluate({ x: 1, y: 1 });
            if (typeof test !== 'number' || isNaN(test)) throw new Error();
        } catch (e) {
            this.resCard.innerHTML = `<span style="color:#f59e0b">Escribiendo fórmula... (Ej: x*y, sin(x)*cos(y), x^2 - y^2)</span>`;
            return; // Abortar antes de llamar a Plotly
        }

        const xArr = [], yArr = [], zArr = [];
        for (let i = 0; i <= steps; i++) {
            xArr.push(-L + i * h);
            yArr.push(-L + i * h);
        }

        let minZ = Infinity, maxZ = -Infinity;

        // 2. GENERAR MATRIZ Z COMPLETA
        for (let i = 0; i <= steps; i++) {
            const row = [];
            const y = yArr[i];
            for (let j = 0; j <= steps; j++) {
                const x = xArr[j];
                let zVal = 0.0;
                try {
                    const r = compiled.evaluate({ x, y });
                    if (typeof r === 'number' && isFinite(r) && !isNaN(r)) {
                        zVal = r;
                    }
                } catch(err) {
                    zVal = 0.0;
                }
                if (zVal < minZ) minZ = zVal;
                if (zVal > maxZ) maxZ = zVal;
                row.push(zVal);
            }
            zArr.push(row);
        }

        // 3. PROTECCIÓN CRÍTICA DE RANGO Z (Evita división por cero y error uniformMatrix4fv)
        if (minZ === Infinity || maxZ === -Infinity) {
            minZ = -1.0; maxZ = 1.0;
        } else if (Math.abs(maxZ - minZ) < 1e-4) {
            minZ -= 1.0;
            maxZ += 1.0;
        }

        const totalVerts = (steps + 1) * (steps + 1);
        const totalTris = steps * steps * 2;
        this.resCard.innerHTML = `
            • <b>Ecuación</b>: z = ${cleanEq}<br>
            • <b>Vértices</b>: ${totalVerts.toLocaleString()} | <b>Triángulos</b>: ${totalTris.toLocaleString()}<br>
            • <b>Rango Z</b>: [${minZ.toFixed(2)}, ${maxZ.toFixed(2)}] | <b>Dominio L</b>: ±${L}
        `;

        const data = [{
            z: zArr,
            x: xArr,
            y: yArr,
            type: 'surface',
            colorscale: 'Viridis',
            showscale: false
        }];

        const layout = {
            paper_bgcolor: '#202020',
            plot_bgcolor: '#202020',
            scene: {
                aspectmode: 'manual',
                aspectratio: { x: 1, y: 1, z: 0.5 },
                xaxis: { title: 'X', color: '#888', gridcolor: '#444' },
                yaxis: { title: 'Y', color: '#888', gridcolor: '#444' },
                zaxis: {
                    title: 'Z',
                    color: '#888',
                    gridcolor: '#444',
                    range: [minZ, maxZ] // Fijar rango evita el fallo de uniformMatrix4fv
                }
            },
            margin: { l: 0, r: 0, b: 0, t: 10 }
        };

        safePlot(this.plotEl, data, layout);
    }

    generateCode() {
        const engine = this.selectEngine.getValue();
        const rawEq = sanitizeMathExpression(this.inEq.getValue());
        const L = this.sliderRange.getValue();
        const steps = this.sliderRes.getValue();

        let code = "";
        switch (engine) {
            case "blender":
                this.currentExtension = ".py";
                code = this.getBlenderPythonCode(rawEq, L, steps);
                break;
            case "godot":
                this.currentExtension = ".gd";
                code = this.getGodotGDScriptCode(rawEq, L, steps);
                break;
            case "threejs":
                this.currentExtension = ".js";
                code = this.getThreeJsCode(rawEq, L, steps);
                break;
            case "unity":
                this.currentExtension = ".cs";
                code = this.getUnityCSharpCode(rawEq, L, steps);
                break;
            case "unreal":
                this.currentExtension = ".cpp";
                code = this.getUnrealCppCode(rawEq, L, steps);
                break;
            case "stride":
                this.currentExtension = ".cs";
                code = this.getStrideCSharpCode(rawEq, L, steps);
                break;
        }

        this.generatedCode = code;
        this.codePreview.textContent = code;
    }

    getBlenderPythonCode(eq, L, steps) {
        let pyEq = eq.replace(/\^/g, '**').replace(/sin\(/g, 'math.sin(').replace(/cos\(/g, 'math.cos(').replace(/sqrt\(/g, 'math.sqrt(');
        return `# Script Procedural para Blender 3.x / 4.x\nimport bpy, math\n\ndef create_surface():\n    L = ${L}\n    steps = ${steps}\n    h = (2.0 * L) / steps\n    verts, faces = [], []\n    for i in range(steps + 1):\n        y = -L + i * h\n        for j in range(steps + 1):\n            x = -L + j * h\n            try: z = ${pyEq}\n            except: z = 0.0\n            verts.append((x, y, z))\n    for i in range(steps):\n        for j in range(steps):\n            v0 = i * (steps + 1) + j\n            faces.append((v0, v0 + 1, (i + 1) * (steps + 1) + j + 1, (i + 1) * (steps + 1) + j))\n    mesh = bpy.data.meshes.new("MathSurface")\n    mesh.from_pydata(verts, [], faces)\n    mesh.update()\n    obj = bpy.data.objects.new("MathSurfaceObj", mesh)\n    bpy.context.collection.objects.link(obj)\n\ncreate_surface()\n`;
    }

    getGodotGDScriptCode(eq, L, steps) {
        let gdEq = eq.replace(/\^/g, '**');
        return `@tool\nextends MeshInstance3D\n# Godot 4 SurfaceTool Script\n@export var L: float = ${L}\n@export var steps: int = ${steps}\n\nfunc _ready():\n    var st = SurfaceTool.new()\n    st.begin(Mesh.PRIMITIVE_TRIANGLES)\n    var h = (2.0 * L) / float(steps)\n    for i in range(steps):\n        var y0 = -L + float(i)*h\n        var y1 = y0 + h\n        for j in range(steps):\n            var x0 = -L + float(j)*h\n            var x1 = x0 + h\n            var p00 = Vector3(x0, ${gdEq.replace(/x/g, "x0").replace(/y/g, "y0")}, y0)\n            var p10 = Vector3(x1, ${gdEq.replace(/x/g, "x1").replace(/y/g, "y0")}, y0)\n            var p11 = Vector3(x1, ${gdEq.replace(/x/g, "x1").replace(/y/g, "y1")}, y1)\n            st.add_vertex(p00); st.add_vertex(p10); st.add_vertex(p11)\n    st.generate_normals()\n    mesh = st.commit()\n`;
    }

    getThreeJsCode(eq, L, steps) {
        let jsEq = eq.replace(/\^/g, '**').replace(/sin\(/g, 'Math.sin(').replace(/sqrt\(/g, 'Math.sqrt(');
        return `import * as THREE from 'three';\nexport function createSurface() {\n    const L = ${L}, seg = ${steps};\n    const geo = new THREE.PlaneGeometry(2*L, 2*L, seg, seg);\n    const pos = geo.attributes.position;\n    for (let i = 0; i < pos.count; i++) {\n        const x = pos.getX(i), y = pos.getY(i);\n        pos.setZ(i, ${jsEq});\n    }\n    geo.computeVertexNormals();\n    return new THREE.Mesh(geo, new THREE.MeshStandardMaterial({ color: 0x5c9ce6 }));\n}\n`;
    }

    getUnityCSharpCode(eq, L, steps) {
        let csEq = eq.replace(/x\^2/g, 'x*x').replace(/y\^2/g, 'y*y').replace(/sin\(/g, 'Mathf.Sin(').replace(/sqrt\(/g, 'Mathf.Sqrt(');
        return `using UnityEngine;\n[RequireComponent(typeof(MeshFilter), typeof(MeshRenderer))]\npublic class SurfaceGenerator : MonoBehaviour {\n    void Start() {\n        Mesh m = new Mesh();\n        int steps = ${steps}; float L = ${L}f, h = 2*L/steps;\n        Vector3[] v = new Vector3[(steps+1)*(steps+1)];\n        for (int i=0, y=0; y<=steps; y++) {\n            float yP = -L + y*h;\n            for (int x=0; x<=steps; x++, i++) {\n                float xP = -L + x*h;\n                v[i] = new Vector3(xP, ${csEq.replace(/x/g, "xP").replace(/y/g, "yP")}, yP);\n            }\n        }\n        m.vertices = v;\n        m.RecalculateNormals();\n        GetComponent<MeshFilter>().mesh = m;\n    }\n}\n`;
    }

    getUnrealCppCode(eq, L, steps) {
        return `// Unreal Engine 5 ProceduralMesh\n#include "ProceduralMeshComponent.h"\nvoid GenerateMesh(UProceduralMeshComponent* P) {\n    TArray<FVector> V; TArray<int32> T;\n    // Generar vértices y caras con: z = ${eq}\n}\n`;
    }

    getStrideCSharpCode(eq, L, steps) {
        return `// Stride Engine Procedural VertexBuffer\nusing Stride.Graphics;\npublic static class MeshGen { /* Buffer procedural para z = ${eq} */ }\n`;
    }

    copyToClipboard() {
        navigator.clipboard.writeText(this.generatedCode).then(() => {
            const orig = this.btnCopy.texto;
            this.btnCopy.setTexto("¡Copiado!");
            this.btnCopy.setStyle({ color: "#10b981" });
            setTimeout(() => {
                this.btnCopy.setTexto(orig);
                this.btnCopy.setStyle({ color: "#6d6b6b" });
            }, 1800);
        });
    }

    downloadCodeFile() {
        const engine = this.selectEngine.getValue();
        const filename = `SurfaceMesh_${engine}${this.currentExtension}`;
        const blob = new Blob([this.generatedCode], { type: "text/plain;charset=utf-8" });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = filename;
        a.click();
        URL.revokeObjectURL(url);
    }
}

// =============================================================================
// 3. MÓDULOS DE VECTORES, DERIVADAS, INTEGRALES, REGRESIÓN Y BÉZIER
// =============================================================================
class Vectores3DModule {
    init(controlsContainer, plotElement) {
        this.plotEl = plotElement;
        this.panel = new GiovanniContainerSimple({ title: "Álgebra Vectorial 3D", isOpen: true, width: "100%" });

        const lblU = document.createElement("div"); lblU.innerHTML = `<span class="math-tag">Vector U</span>`; this.panel.appendChild(lblU);
        const rowU = document.createElement("div"); rowU.className = "math-row";
        this.uX = new GiovanniInputNumber({ label: "Ux", value: 3, step: 0.5 });
        this.uY = new GiovanniInputNumber({ label: "Uy", value: 2, step: 0.5 });
        this.uZ = new GiovanniInputNumber({ label: "Uz", value: 1, step: 0.5 });
        rowU.appendChild(this.uX.element); rowU.appendChild(this.uY.element); rowU.appendChild(this.uZ.element);
        this.panel.appendChild(rowU);

        const lblV = document.createElement("div"); lblV.innerHTML = `<span class="math-tag">Vector V</span>`; this.panel.appendChild(lblV);
        const rowV = document.createElement("div"); rowV.className = "math-row";
        this.vX = new GiovanniInputNumber({ label: "Vx", value: 1, step: 0.5 });
        this.vY = new GiovanniInputNumber({ label: "Vy", value: 4, step: 0.5 });
        this.vZ = new GiovanniInputNumber({ label: "Vz", value: 2, step: 0.5 });
        rowV.appendChild(this.vX.element); rowV.appendChild(this.vY.element); rowV.appendChild(this.vZ.element);
        this.panel.appendChild(rowV);

        this.toggleProj = new GiovanniToggle({ label: "Proyección Proj_v(u)", checked: true });
        this.toggleCross = new GiovanniToggle({ label: "Producto Cruz Ortogonal", checked: true });
        this.panel.appendChild(this.toggleProj.element);
        this.panel.appendChild(this.toggleCross.element);

        this.resCard = document.createElement("div"); this.resCard.className = "math-result-card"; this.panel.appendChild(this.resCard);
        controlsContainer.appendChild(this.panel.element);

        [this.uX, this.uY, this.uZ, this.vX, this.vY, this.vZ].forEach(c => c.options.onChange = () => this.render());
        this.toggleProj.options.onChange = () => this.render();
        this.toggleCross.options.onChange = () => this.render();
    }

    render() {
        if (!this.plotEl || this.plotEl.clientWidth < 10 || this.plotEl.clientHeight < 10) return;

        const u = [this.uX.getValue(), this.uY.getValue(), this.uZ.getValue()];
        const v = [this.vX.getValue(), this.vY.getValue(), this.vZ.getValue()];
        const magU = Math.hypot(...u), magV = Math.hypot(...v);
        const dot = u[0]*v[0] + u[1]*v[1] + u[2]*v[2];
        const angDeg = (magU > 0 && magV > 0) ? (Math.acos(Math.max(-1, Math.min(1, dot / (magU * magV)))) * 180 / Math.PI) : 0;
        const cross = [u[1]*v[2] - u[2]*v[1], u[2]*v[0] - u[0]*v[2], u[0]*v[1] - u[1]*v[0]];
        const proj = magV > 0 ? [(dot/magV**2)*v[0], (dot/magV**2)*v[1], (dot/magV**2)*v[2]] : [0,0,0];

        this.resCard.innerHTML = `
            • <b>||u||</b>: ${magU.toFixed(3)} | <b>||v||</b>: ${magV.toFixed(3)}<br>
            • <b>Dot (u · v)</b>: ${dot.toFixed(3)} | <b>Ángulo θ</b>: ${angDeg.toFixed(2)}°<br>
            • <b>Cruz (u × v)</b>: (${cross.map(n => n.toFixed(2)).join(', ')})<br>
            • <b>Proj_v(u)</b>: (${proj.map(n => n.toFixed(2)).join(', ')})
        `;

        const traces = [
            { type: 'scatter3d', mode: 'lines+markers', name: 'Vector U', x: [0, u[0]], y: [0, u[1]], z: [0, u[2]], line: { width: 8, color: '#3b82f6' }, marker: { size: [0,6], color: '#3b82f6' } },
            { type: 'scatter3d', mode: 'lines+markers', name: 'Vector V', x: [0, v[0]], y: [0, v[1]], z: [0, v[2]], line: { width: 8, color: '#10b981' }, marker: { size: [0,6], color: '#10b981' } }
        ];

        if (this.toggleCross.getValue() && Math.hypot(...cross) > 0) {
            traces.push({ type: 'scatter3d', mode: 'lines+markers', name: 'u × v', x: [0, cross[0]], y: [0, cross[1]], z: [0, cross[2]], line: { width: 8, color: '#f59e0b' }, marker: { size: [0,6], color: '#f59e0b' } });
        }
        if (this.toggleProj.getValue() && magV > 0) {
            traces.push({ type: 'scatter3d', mode: 'lines+markers', name: 'Proj_v(u)', x: [0, proj[0]], y: [0, proj[1]], z: [0, proj[2]], line: { width: 6, dash: 'dot', color: '#ec4899' }, marker: { size: [0,5], color: '#ec4899' } });
        }

        const layout = {
            paper_bgcolor: '#202020', plot_bgcolor: '#202020',
            scene: {
                aspectmode: 'cube',
                xaxis: { color: '#888', gridcolor: '#383838' },
                yaxis: { color: '#888', gridcolor: '#383838' },
                zaxis: { color: '#888', gridcolor: '#383838' }
            },
            margin: { l: 0, r: 0, b: 0, t: 10 }, legend: { font: { color: '#ccc' }, orientation: 'h' }
        };
        safePlot(this.plotEl, traces, layout);
    }
}

class DerivadasModule {
    init(c, p) {
        this.plotEl = p;
        this.panel = new GiovanniContainerSimple({ title: "Cálculo Diferencial 2D", isOpen: true, width: "100%" });
        this.inputF = new GiovanniInputText({ label: "Función f(x)", value: "sin(x) + 0.3*x" });
        this.sliderX0 = new GiovanniSlider({ label: "Punto Tangente x₀", min: -6, max: 6, step: 0.1, value: 1.5 });
        this.resCard = document.createElement("div"); this.resCard.className = "math-result-card";
        this.panel.appendChild(this.inputF.element); this.panel.appendChild(this.sliderX0.element); this.panel.appendChild(this.resCard);
        c.appendChild(this.panel.element);
        this.inputF.options.onChange = () => this.render();
        this.sliderX0.options.onInput = () => this.render();
    }
    render() {
        if (!this.plotEl || this.plotEl.clientWidth < 10) return;
        const eq = sanitizeMathExpression(this.inputF.getValue()), x0 = this.sliderX0.getValue();
        let d1Str = "Error", y0 = 0, mTan = 0;
        try {
            const d1 = math.derivative(eq, 'x');
            d1Str = d1.toString();
            y0 = math.evaluate(eq, { x: x0 });
            mTan = math.evaluate(d1Str, { x: x0 });
        } catch(e){ return; }
        this.resCard.innerHTML = `• <b>f'(x)</b>: ${d1Str}<br>• <b>Tangente</b>: y = ${mTan.toFixed(3)}(x - ${x0}) + ${y0.toFixed(3)}`;
        const plotX = [], plotYF = [], plotYTan = [];
        for (let i = 0; i <= 200; i++) {
            const x = (x0 - 5) + (i * 10 / 200);
            plotX.push(x);
            try { plotYF.push(math.evaluate(eq, { x })); } catch(e){ plotYF.push(null); }
            plotYTan.push(y0 + mTan * (x - x0));
        }
        const traces = [
            { x: plotX, y: plotYF, mode: 'lines', name: 'f(x)', line: { color: '#3b82f6', width: 2.5 } },
            { x: plotX, y: plotYTan, mode: 'lines', name: 'Tangente', line: { color: '#f59e0b', width: 1.8, dash: 'dash' } },
            { x: [x0], y: [y0], mode: 'markers', name: 'P0', marker: { size: 9, color: '#f59e0b' } }
        ];
        safePlot(this.plotEl, traces, { paper_bgcolor: '#202020', plot_bgcolor: '#202020', xaxis: { color: '#888', gridcolor: '#303030' }, yaxis: { color: '#888', gridcolor: '#303030' }, margin: { l: 40, r: 20, b: 30, t: 20 } });
    }
}

class IntegralesModule {
    init(c, p) {
        this.plotEl = p;
        this.panel = new GiovanniContainerSimple({ title: "Cálculo Integral & Áreas", isOpen: true, width: "100%" });
        this.inputF = new GiovanniInputText({ label: "Curva f(x)", value: "4 - x^2" });
        this.inputG = new GiovanniInputText({ label: "Curva g(x)", value: "x + 2" });
        const rowLim = document.createElement("div"); rowLim.className = "math-row";
        this.limA = new GiovanniInputNumber({ label: "Límite a", value: -1, step: 0.5 });
        this.limB = new GiovanniInputNumber({ label: "Límite b", value: 2, step: 0.5 });
        rowLim.appendChild(this.limA.element); rowLim.appendChild(this.limB.element);
        this.resCard = document.createElement("div"); this.resCard.className = "math-result-card";
        this.panel.appendChild(this.inputF.element); this.panel.appendChild(this.inputG.element);
        this.panel.appendChild(rowLim); this.panel.appendChild(this.resCard);
        c.appendChild(this.panel.element);
        this.inputF.options.onChange = () => this.render();
        this.inputG.options.onChange = () => this.render();
        this.limA.options.onChange = () => this.render();
        this.limB.options.onChange = () => this.render();
    }
    render() {
        if (!this.plotEl || this.plotEl.clientWidth < 10) return;
        const eqF = sanitizeMathExpression(this.inputF.getValue()), eqG = sanitizeMathExpression(this.inputG.getValue());
        const a = this.limA.getValue(), b = this.limB.getValue();
        const N = 200, h = (b - a) / N;
        let intF = 0, area = 0;
        const fillX = [], fillY1 = [], fillY2 = [];
        if (b > a) {
            for (let i = 0; i <= N; i++) {
                const cx = a + i * h;
                let y1 = 0, y2 = 0;
                try { y1 = math.evaluate(eqF, { x: cx }); } catch(e){}
                try { y2 = math.evaluate(eqG, { x: cx }); } catch(e){}
                fillX.push(cx); fillY1.push(y1); fillY2.push(y2);
                const w = (i === 0 || i === N) ? 0.5 : 1;
                intF += w * y1 * h; area += w * Math.abs(y1 - y2) * h;
            }
        }
        this.resCard.innerHTML = `• <b>∫ f(x) dx</b>: ${intF.toFixed(4)}<br>• <b>Área entre curvas</b>: ${area.toFixed(4)} u²`;
        const plotX = [], plotYF = [], plotYG = [];
        for (let i = 0; i <= 200; i++) {
            const x = (a - 2) + (i * ((b - a) + 4) / 200);
            plotX.push(x);
            try { plotYF.push(math.evaluate(eqF, { x })); } catch(e){ plotYF.push(null); }
            try { plotYG.push(math.evaluate(eqG, { x })); } catch(e){ plotYG.push(null); }
        }
        const traces = [
            { x: plotX, y: plotYF, mode: 'lines', name: 'f(x)', line: { color: '#3b82f6', width: 2 } },
            { x: plotX, y: plotYG, mode: 'lines', name: 'g(x)', line: { color: '#10b981', width: 2 } }
        ];
        if (fillX.length > 0) {
            traces.push({ x: [...fillX, ...fillX.slice().reverse()], y: [...fillY1, ...fillY2.slice().reverse()], fill: 'toself', fillcolor: 'rgba(92, 156, 230, 0.28)', line: { width: 0 }, name: 'Área' });
        }
        safePlot(this.plotEl, traces, { paper_bgcolor: '#202020', plot_bgcolor: '#202020', xaxis: { color: '#888', gridcolor: '#303030' }, yaxis: { color: '#888', gridcolor: '#303030' }, margin: { l: 40, r: 20, b: 30, t: 20 } });
    }
}

class RegresionPolinomicaModule {
    init(c, p) {
        this.plotEl = p;
        this.panel = new GiovanniContainerSimple({ title: "Regresión Polinómica", isOpen: true, width: "100%" });
        this.inPts = new GiovanniInputText({ label: "Puntos (x,y)", value: "(1, 2.1), (2, 4.2), (3, 8.8), (4, 16.5), (5, 26.0)" });
        this.degInput = new GiovanniInputNumber({ label: "Grado Polinomio", min: 1, max: 5, step: 1, value: 2 });
        this.resCard = document.createElement("div"); this.resCard.className = "math-result-card";
        this.panel.appendChild(this.inPts.element); this.panel.appendChild(this.degInput.element); this.panel.appendChild(this.resCard);
        c.appendChild(this.panel.element);
        this.inPts.options.onChange = () => this.render();
        this.degInput.options.onChange = () => this.render();
    }
    render() {
        if (!this.plotEl || this.plotEl.clientWidth < 10) return;
        const text = this.inPts.getValue(), degree = this.degInput.getValue();
        const pts = []; const regex = /\(([^,]+),\s*([^)]+)\)/g; let m;
        while ((m = regex.exec(text)) !== null) {
            const x = parseFloat(m[1]), y = parseFloat(m[2]);
            if (!isNaN(x) && !isNaN(y)) pts.push({ x, y });
        }
        if (pts.length < degree + 1) return;
        const X = [], Y = [];
        for (let i = 0; i <= degree; i++) {
            X[i] = [];
            for (let j = 0; j <= degree; j++) X[i][j] = pts.reduce((s, p) => s + Math.pow(p.x, i + j), 0);
            Y[i] = pts.reduce((s, p) => s + p.y * Math.pow(p.x, i), 0);
        }
        let coeffs = math.lusolve(X, Y).map(c => c[0]);
        this.resCard.innerHTML = `• <b>Polinomio Ajustado Exitosamente</b> (Grado ${degree})`;
        const xVals = pts.map(p => p.x), minX = Math.min(...xVals) - 1, maxX = Math.max(...xVals) + 1;
        const curveX = [], curveY = [];
        for (let i = 0; i <= 150; i++) {
            const cx = minX + (i * (maxX - minX) / 150);
            curveX.push(cx);
            curveY.push(coeffs.reduce((acc, c, idx) => acc + c * Math.pow(cx, idx), 0));
        }
        const traces = [
            { x: pts.map(p => p.x), y: pts.map(p => p.y), mode: 'markers', name: 'Datos', marker: { size: 8, color: '#ef4444' } },
            { x: curveX, y: curveY, mode: 'lines', name: 'Polinomio', line: { color: '#3b82f6', width: 2 } }
        ];
        safePlot(this.plotEl, traces, { paper_bgcolor: '#202020', plot_bgcolor: '#202020', xaxis: { color: '#888', gridcolor: '#303030' }, yaxis: { color: '#888', gridcolor: '#303030' }, margin: { l: 40, r: 20, b: 30, t: 20 } });
    }
}

class CurvasBezierModule {
    init(c, p) {
        this.plotEl = p;
        this.panel = new GiovanniContainerSimple({ title: "Curvas Bézier Cúbicas", isOpen: true, width: "100%" });
        const rowP0 = document.createElement("div"); rowP0.className = "math-row";
        this.p0x = new GiovanniInputNumber({ label: "P0x", value: 0, step: 0.5 });
        this.p0y = new GiovanniInputNumber({ label: "P0y", value: 0, step: 0.5 });
        rowP0.appendChild(this.p0x.element); rowP0.appendChild(this.p0y.element);
        this.panel.appendChild(rowP0);
        const rowP1 = document.createElement("div"); rowP1.className = "math-row";
        this.p1x = new GiovanniInputNumber({ label: "P1x", value: 2, step: 0.5 });
        this.p1y = new GiovanniInputNumber({ label: "P1y", value: 5, step: 0.5 });
        rowP1.appendChild(this.p1x.element); rowP1.appendChild(this.p1y.element);
        this.panel.appendChild(rowP1);
        const rowP2 = document.createElement("div"); rowP2.className = "math-row";
        this.p2x = new GiovanniInputNumber({ label: "P2x", value: 6, step: 0.5 });
        this.p2y = new GiovanniInputNumber({ label: "P2y", value: 5, step: 0.5 });
        rowP2.appendChild(this.p2x.element); rowP2.appendChild(this.p2y.element);
        this.panel.appendChild(rowP2);
        const rowP3 = document.createElement("div"); rowP3.className = "math-row";
        this.p3x = new GiovanniInputNumber({ label: "P3x", value: 8, step: 0.5 });
        this.p3y = new GiovanniInputNumber({ label: "P3y", value: 1, step: 0.5 });
        rowP3.appendChild(this.p3x.element); rowP3.appendChild(this.p3y.element);
        this.panel.appendChild(rowP3);
        this.sliderT = new GiovanniSlider({ label: "Parámetro t", min: 0, max: 1, step: 0.01, value: 0.5 });
        this.panel.appendChild(this.sliderT.element);
        c.appendChild(this.panel.element);
        [this.p0x, this.p0y, this.p1x, this.p1y, this.p2x, this.p2y, this.p3x, this.p3y].forEach(el => el.options.onChange = () => this.render());
        this.sliderT.options.onInput = () => this.render();
    }
    render() {
        if (!this.plotEl || this.plotEl.clientWidth < 10) return;
        const P0 = [this.p0x.getValue(), this.p0y.getValue()], P1 = [this.p1x.getValue(), this.p1y.getValue()];
        const P2 = [this.p2x.getValue(), this.p2y.getValue()], P3 = [this.p3x.getValue(), this.p3y.getValue()];
        const t = this.sliderT.getValue();
        const calcB = (tau) => {
            const u = 1 - tau;
            return [
                u**3*P0[0] + 3*u**2*tau*P1[0] + 3*u*tau**2*P2[0] + tau**3*P3[0],
                u**3*P0[1] + 3*u**2*tau*P1[1] + 3*u*tau**2*P2[1] + tau**3*P3[1]
            ];
        };
        const Pt = calcB(t), curveX = [], curveY = [];
        for (let i = 0; i <= 100; i++) {
            const p = calcB(i / 100);
            curveX.push(p[0]); curveY.push(p[1]);
        }
        const traces = [
            { x: [P0[0], P1[0], P2[0], P3[0]], y: [P0[1], P1[1], P2[1], P3[1]], mode: 'lines+markers', name: 'Polígono', line: { dash: 'dot', color: '#888' }, marker: { size: 8, color: '#f59e0b' } },
            { x: curveX, y: curveY, mode: 'lines', name: 'Bézier', line: { color: '#3b82f6', width: 3 } },
            { x: [Pt[0]], y: [Pt[1]], mode: 'markers', name: 'B(t)', marker: { size: 10, color: '#ef4444' } }
        ];
        safePlot(this.plotEl, traces, { paper_bgcolor: '#202020', plot_bgcolor: '#202020', xaxis: { color: '#888', gridcolor: '#303030' }, yaxis: { color: '#888', gridcolor: '#303030' }, margin: { l: 40, r: 20, b: 30, t: 20 } });
    }
}
