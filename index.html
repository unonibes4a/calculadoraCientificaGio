<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Laboratorio Matemático & Vectorial HD</title>

    <!-- Librerías de Cálculo y Visualización -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mathjs/11.8.0/math.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/plotly.js/2.18.2/plotly.min.js"></script>

    <!-- Iconos de Material Symbols para tus componentes -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />

    <!-- Tu librería de UI modular -->
    <script src="https://unonibes4a.github.io/pintaresta/aggio.js"></script>

    <style>
        :root {
            --bg-main: #181818;
            --bg-panel: #242424;
            --accent: #5c9ce6;
            --border: #353535;
            --text: #e0e0e0;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text);
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            height: 100vh;
            width: 100vw;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* BARRA SUPERIOR DE PESTAÑAS (TABS HEADER) */
        #tab-header {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 16px;
            background: #202020;
            border-bottom: 1px solid var(--border);
            overflow-x: auto;
            flex-shrink: 0;
        }

        #tab-header::-webkit-scrollbar {
            height: 4px;
        }

        .tab-brand {
            font-size: 14px;
            font-weight: 700;
            color: var(--accent);
            white-space: nowrap;
            margin-right: 12px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        /* CONTENEDOR PRINCIPAL DE TRABAJO */
        #workspace-area {
            flex: 1;
            position: relative;
            overflow-y: auto;
            padding: 16px;
            width: 100%;
            height: 100%;
        }

        /* VISTA DE CADA PESTAÑA */
        .tab-content {
            display: none;
            width: 100%;
            height: 100%;
            animation: fadeIn 0.2s ease-in-out forwards;
        }

        .tab-content.active {
            display: grid;
            gap: 16px;
            /* En PC y TV: Controles a la izquierda y gráfica panorámica a la derecha */
            grid-template-columns: minmax(360px, 420px) 1fr;
            height: calc(100vh - 85px);
        }

        /* RESPONSIVIDAD: En Tablets y Celulares pasa a 1 sola columna */
        @media (max-width: 980px) {
            body {
                overflow-y: auto;
                height: auto;
            }
            #workspace-area {
                overflow-y: visible;
                height: auto;
            }
            .tab-content.active {
                display: flex;
                flex-direction: column;
                height: auto;
            }
            .panel-graph-column {
                min-height: 480px !important;
                height: 550px !important;
            }
        }

        /* COLUMNA DE CONTROLES */
        .panel-controls-column {
            display: flex;
            flex-direction: column;
            gap: 12px;
            overflow-y: auto;
            padding-right: 4px;
        }

        /* COLUMNA DE GRÁFICA GIGANTE */
        .panel-graph-column {
            background: var(--bg-panel);
            border: 1px solid var(--border);
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            width: 100%;
            height: 100%;
            min-height: 500px;
        }

        .graph-plotly {
            width: 100%;
            height: 100%;
            flex: 1;
        }

        /* TARJETA DE RESULTADOS */
        .math-result-card {
            background: #1e1e1e;
            border-left: 3px solid var(--accent);
            padding: 10px 14px;
            border-radius: 0 6px 6px 0;
            font-size: 13px;
            line-height: 1.6;
            color: #dcdcdc;
            font-family: Consolas, monospace;
        }

        .math-row {
            display: flex;
            gap: 8px;
            align-items: center;
            width: 100%;
        }

        .math-row > * {
            flex: 1;
        }

        .math-tag {
            font-size: 11px;
            padding: 2px 6px;
            border-radius: 4px;
            background: rgba(92, 156, 230, 0.18);
            color: var(--accent);
            font-weight: 600;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(4px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <!-- BARRA DE PESTAÑAS (TABS) -->
    <div id="tab-header">
        <div class="tab-brand">
            <span class="material-symbols-outlined">calculate</span>
            <span>MathLab Studio</span>
        </div>
        <div id="tabs-buttons-container" style="display: flex; gap: 8px;"></div>
    </div>

    <!-- ÁREA DE PESTAÑAS -->
    <main id="workspace-area">

        <!-- TAB 1: VECTORES 3D -->
        <section id="tab-vec" class="tab-content active">
            <div class="panel-controls-column" id="vec-controls-slot"></div>
            <div class="panel-graph-column">
                <div id="plot-vectorial-3d" class="graph-plotly"></div>
            </div>
        </section>

        <!-- TAB 2: CÁLCULO 2D -->
        <section id="tab-calc" class="tab-content">
            <div class="panel-controls-column" id="calc-controls-slot"></div>
            <div class="panel-graph-column">
                <div id="plot-calculo-2d" class="graph-plotly"></div>
            </div>
        </section>

        <!-- TAB 3: REGRESIÓN POLINÓMICA -->
        <section id="tab-reg" class="tab-content">
            <div class="panel-controls-column" id="reg-controls-slot"></div>
            <div class="panel-graph-column">
                <div id="plot-regression-2d" class="graph-plotly"></div>
            </div>
        </section>

        <!-- TAB 4: SUPERFICIES 3D -->
        <section id="tab-surf" class="tab-content">
            <div class="panel-controls-column" id="surf-controls-slot"></div>
            <div class="panel-graph-column">
                <div id="plot-superficie-3d" class="graph-plotly"></div>
            </div>
        </section>

    </main>

<script>
document.addEventListener("DOMContentLoaded", () => {

    // =========================================================================
    // 0. GENERADOR DE PESTAÑAS (TABS) CON GiovanniBoton
    // =========================================================================
    const tabsConfig = [
        { id: "tab-vec", label: "Vectores 3D & Proyección", icon: '<svg viewBox="0 0 24 24"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>' },
        { id: "tab-calc", label: "Cálculo 2D & Áreas", icon: '<svg viewBox="0 0 24 24"><path d="M3.5 18.49l6-6.01 4 4L22 6.92l-1.41-1.41-7.09 7.97-4-4L2 16.99z"/></svg>' },
        { id: "tab-reg", label: "Regresión Polinómica", icon: '<svg viewBox="0 0 24 24"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-2 10h-4v4h-2v-4H7v-2h4V7h2v4h4v2z"/></svg>' },
        { id: "tab-surf", label: "Superficies 3D", icon: '<svg viewBox="0 0 24 24"><path d="M21 16.5c0 .38-.21.71-.53.88l-7.9 4.44c-.16.12-.36.18-.57.18s-.41-.06-.57-.18l-7.9-4.44A.991.991 0 0 1 3 16.5v-9c0-.38.21-.71.53-.88l7.9-4.44c.16-.12.36-.18.57-.18s.41.06.57.18l7.9 4.44c.32.17.53.5.53.88v9z"/></svg>' }
    ];

    const tabsContainer = document.getElementById("tabs-buttons-container");
    const tabButtons = [];

    function switchTab(tabId) {
        document.querySelectorAll(".tab-content").forEach(el => el.classList.remove("active"));
        const target = document.getElementById(tabId);
        if (target) target.classList.add("active");

        // Actualizar colores de los botones
        tabButtons.forEach(btn => {
            if (btn._tabId === tabId) {
                btn.setStyle({ backgroundColor: "#5c9ce6", color: "#ffffff" });
            } else {
                btn.setStyle({ backgroundColor: "#2b2b2b", color: "#b0b0b0" });
            }
        });

        // Forzar redimensionamiento óptimo del gráfico activo en la pantalla
        setTimeout(() => {
            window.dispatchEvent(new Event('resize'));
        }, 50);
    }

    tabsConfig.forEach((cfg, idx) => {
        const btn = new GiovanniBoton({
            svg: cfg.icon,
            texto: cfg.label,
            ancho: 160,
            alto: 34,
            position: 'static',
            background: idx === 0 ? "#5c9ce6" : "#2b2b2b",
            color: idx === 0 ? "#ffffff" : "#b0b0b0",
            onClick: () => switchTab(cfg.id)
        });
        btn._tabId = cfg.id;
        // Ajuste estilístico para formato pestaña
        btn.el.style.width = "auto";
        btn.el.style.padding = "0 12px";
        btn.el.style.gap = "6px";
        tabButtons.push(btn);
        btn.montar(tabsContainer);
    });

    // =========================================================================
    // 1. MÓDULO VECTORES 3D
    // =========================================================================
    const vecSlot = document.getElementById("vec-controls-slot");
    const panelVec = new GiovanniContainerSimple({ title: "Controles de Vectores 3D", isOpen: true, width: "100%" });

    const lblU = document.createElement("div");
    lblU.innerHTML = `<span class="math-tag">Vector U (Azul)</span>`;
    panelVec.appendChild(lblU);

    const rowU = document.createElement("div");
    rowU.className = "math-row";
    const uX = new GiovanniInputNumber({ label: "Ux", value: 3, step: 0.5 });
    const uY = new GiovanniInputNumber({ label: "Uy", value: 4, step: 0.5 });
    const uZ = new GiovanniInputNumber({ label: "Uz", value: 1, step: 0.5 });
    rowU.appendChild(uX.element); rowU.appendChild(uY.element); rowU.appendChild(uZ.element);
    panelVec.appendChild(rowU);

    const lblV = document.createElement("div");
    lblV.innerHTML = `<span class="math-tag">Vector V (Verde)</span>`;
    panelVec.appendChild(lblV);

    const rowV = document.createElement("div");
    rowV.className = "math-row";
    const vX = new GiovanniInputNumber({ label: "Vx", value: 4, step: 0.5 });
    const vY = new GiovanniInputNumber({ label: "Vy", value: 1, step: 0.5 });
    const vZ = new GiovanniInputNumber({ label: "Vz", value: 3, step: 0.5 });
    rowV.appendChild(vX.element); rowV.appendChild(vY.element); rowV.appendChild(vZ.element);
    panelVec.appendChild(rowV);

    const toggleProj = new GiovanniToggle({ label: "Mostrar Proyección Proj_v(u)", checked: true });
    const toggleCross = new GiovanniToggle({ label: "Mostrar Producto Cruz (Ortogonal)", checked: true });
    panelVec.appendChild(toggleProj.element);
    panelVec.appendChild(toggleCross.element);

    const resVec = document.createElement("div");
    resVec.className = "math-result-card";
    panelVec.appendChild(resVec);

    vecSlot.appendChild(panelVec.element);

    function actualizarVectores() {
        const u = [uX.getValue(), uY.getValue(), uZ.getValue()];
        const v = [vX.getValue(), vY.getValue(), vZ.getValue()];

        const magU = Math.sqrt(u[0]**2 + u[1]**2 + u[2]**2);
        const magV = Math.sqrt(v[0]**2 + v[1]**2 + v[2]**2);
        const dot = u[0]*v[0] + u[1]*v[1] + u[2]*v[2];

        let angDeg = 0;
        if (magU > 0 && magV > 0) {
            const cosVal = Math.max(-1, Math.min(1, dot / (magU * magV)));
            angDeg = (Math.acos(cosVal) * 180 / Math.PI);
        }

        const cross = [
            u[1]*v[2] - u[2]*v[1],
            u[2]*v[0] - u[0]*v[2],
            u[0]*v[1] - u[1]*v[0]
        ];
        const magCross = Math.sqrt(cross[0]**2 + cross[1]**2 + cross[2]**2);

        let proj = [0, 0, 0];
        if (magV > 0) {
            const sc = dot / (magV**2);
            proj = [sc * v[0], sc * v[1], sc * v[2]];
        }

        resVec.innerHTML = `
            • <b>||u||</b>: ${magU.toFixed(3)} | <b>||v||</b>: ${magV.toFixed(3)}<br>
            • <b>Producto Punto (u · v)</b>: ${dot.toFixed(3)}<br>
            • <b>Ángulo θ</b>: ${angDeg.toFixed(2)}°<br>
            • <b>Producto Cruz (u × v)</b>: (${cross.map(n => n.toFixed(2)).join(', ')})<br>
            • <b>Proyección Proj_v(u)</b>: (${proj.map(n => n.toFixed(2)).join(', ')})
        `;

        const traces = [
            {
                type: 'scatter3d', mode: 'lines+markers', name: 'Vector U',
                x: [0, u[0]], y: [0, u[1]], z: [0, u[2]],
                line: { width: 8, color: '#3b82f6' },
                marker: { size: [0, 6], color: '#3b82f6' }
            },
            {
                type: 'scatter3d', mode: 'lines+markers', name: 'Vector V',
                x: [0, v[0]], y: [0, v[1]], z: [0, v[2]],
                line: { width: 8, color: '#10b981' },
                marker: { size: [0, 6], color: '#10b981' }
            }
        ];

        if (toggleCross.getValue() && magCross > 0) {
            traces.push({
                type: 'scatter3d', mode: 'lines+markers', name: 'Cruz (u × v)',
                x: [0, cross[0]], y: [0, cross[1]], z: [0, cross[2]],
                line: { width: 8, color: '#f59e0b' },
                marker: { size: [0, 6], color: '#f59e0b' }
            });
        }

        if (toggleProj.getValue() && magV > 0) {
            traces.push({
                type: 'scatter3d', mode: 'lines+markers', name: 'Proj_v(u)',
                x: [0, proj[0]], y: [0, proj[1]], z: [0, proj[2]],
                line: { width: 6, dash: 'dot', color: '#ec4899' },
                marker: { size: [0, 5], color: '#ec4899' }
            });
            traces.push({
                type: 'scatter3d', mode: 'lines', name: 'Ortogonal a V',
                x: [u[0], proj[0]], y: [u[1], proj[1]], z: [u[2], proj[2]],
                line: { width: 3, dash: 'dash', color: '#9ca3af' }
            });
        }

        const layout = {
            paper_bgcolor: '#242424',
            plot_bgcolor: '#242424',
            scene: {
                xaxis: { title: 'X', color: '#888', gridcolor: '#383838' },
                yaxis: { title: 'Y', color: '#888', gridcolor: '#383838' },
                zaxis: { title: 'Z', color: '#888', gridcolor: '#383838' }
            },
            margin: { l: 0, r: 0, b: 0, t: 10 },
            legend: { font: { color: '#ccc' }, orientation: 'h' }
        };

        Plotly.react("plot-vectorial-3d", traces, layout, { responsive: true });
    }

    [uX, uY, uZ, vX, vY, vZ].forEach(c => c.options.onChange = actualizarVectores);
    toggleProj.options.onChange = actualizarVectores;
    toggleCross.options.onChange = actualizarVectores;

    // =========================================================================
    // 2. MÓDULO CÁLCULO 2D
    // =========================================================================
    const calcSlot = document.getElementById("calc-controls-slot");
    const panelCalc = new GiovanniContainerSimple({ title: "Controles de Análisis 2D", isOpen: true, width: "100%" });

    const inFuncF = new GiovanniInputText({ label: "Función f(x)", value: "sin(x) + 0.3*x" });
    const inFuncG = new GiovanniInputText({ label: "Función g(x) [Área entre curvas]", value: "cos(x)" });
    panelCalc.appendChild(inFuncF.element);
    panelCalc.appendChild(inFuncG.element);

    const rowLim = document.createElement("div");
    rowLim.className = "math-row";
    const limA = new GiovanniInputNumber({ label: "Límite a", value: 0, step: 0.5 });
    const limB = new GiovanniInputNumber({ label: "Límite b", value: 4, step: 0.5 });
    rowLim.appendChild(limA.element); rowLim.appendChild(limB.element);
    panelCalc.appendChild(rowLim);

    const sliderTanX = new GiovanniSlider({ label: "Tangente en x₀", min: -5, max: 5, step: 0.1, value: 1.5 });
    panelCalc.appendChild(sliderTanX.element);

    const resCalc = document.createElement("div");
    resCalc.className = "math-result-card";
    panelCalc.appendChild(resCalc);

    calcSlot.appendChild(panelCalc.element);

    function actualizarCalculo() {
        const eqF = inFuncF.getValue();
        const eqG = inFuncG.getValue();
        const a = limA.getValue();
        const b = limB.getValue();
        const x0 = sliderTanX.getValue();

        let derivF = "Error", deriv2F = "Error", valF_x0 = 0, slope = 0;
        try {
            const d1 = math.derivative(eqF, 'x');
            derivF = d1.toString();
            deriv2F = math.derivative(d1, 'x').toString();
            valF_x0 = math.evaluate(eqF, { x: x0 });
            slope = math.evaluate(derivF, { x: x0 });
        } catch(e) {}

        const N = 300;
        const h = (b - a) / N;
        let integralF = 0, areaBetween = 0;
        const fillX = [], fillY1 = [], fillY2 = [];

        if (b > a) {
            for (let i = 0; i <= N; i++) {
                const cx = a + i * h;
                let y1 = 0, y2 = 0;
                try { y1 = math.evaluate(eqF, { x: cx }); } catch(e){}
                try { y2 = math.evaluate(eqG, { x: cx }); } catch(e){}

                fillX.push(cx); fillY1.push(y1); fillY2.push(y2);
                const w = (i === 0 || i === N) ? 0.5 : 1;
                integralF += w * y1 * h;
                areaBetween += w * Math.abs(y1 - y2) * h;
            }
        }

        resCalc.innerHTML = `
            • <b>f'(x)</b>: ${derivF}<br>
            • <b>f''(x)</b>: ${deriv2F}<br>
            • <b>Tangente en x₀=${x0}</b>: y = ${slope.toFixed(3)}(x - ${x0}) + ${valF_x0.toFixed(3)}<br>
            • <b>∫ f(x) dx [${a}, ${b}]</b>: ${integralF.toFixed(4)}<br>
            • <b>Área entre f y g</b>: ${areaBetween.toFixed(4)} u²
        `;

        const plotX = [], plotYF = [], plotYG = [], plotYTan = [];
        const xMin = Math.min(-6, a - 1), xMax = Math.max(6, b + 1);
        const steps = 300;
        const dx = (xMax - xMin) / steps;

        for (let i = 0; i <= steps; i++) {
            const x = xMin + i * dx;
            plotX.push(x);
            try { plotYF.push(math.evaluate(eqF, { x })); } catch(e){ plotYF.push(null); }
            try { plotYG.push(math.evaluate(eqG, { x })); } catch(e){ plotYG.push(null); }
            plotYTan.push(valF_x0 + slope * (x - x0));
        }

        const traces = [
            { x: plotX, y: plotYF, mode: 'lines', name: 'f(x)', line: { color: '#3b82f6', width: 2.5 } },
            { x: plotX, y: plotYG, mode: 'lines', name: 'g(x)', line: { color: '#10b981', width: 2 } },
            { x: plotX, y: plotYTan, mode: 'lines', name: 'Tangente', line: { color: '#f59e0b', width: 1.5, dash: 'dash' } },
            { x: [x0], y: [valF_x0], mode: 'markers', name: 'Punto Tangente', marker: { size: 8, color: '#f59e0b' } }
        ];

        if (fillX.length > 0) {
            traces.push({
                x: [...fillX, ...fillX.slice().reverse()],
                y: [...fillY1, ...fillY2.slice().reverse()],
                fill: 'toself',
                fillcolor: 'rgba(92, 156, 230, 0.22)',
                line: { width: 0 },
                name: 'Área Comprendida'
            });
        }

        const layout = {
            paper_bgcolor: '#242424',
            plot_bgcolor: '#242424',
            xaxis: { color: '#888', gridcolor: '#353535', zerolinecolor: '#555' },
            yaxis: { color: '#888', gridcolor: '#353535', zerolinecolor: '#555' },
            margin: { l: 40, r: 20, b: 30, t: 20 },
            legend: { font: { color: '#ccc' }, orientation: 'h' }
        };

        Plotly.react("plot-calculo-2d", traces, layout, { responsive: true });
    }

    inFuncF.options.onChange = actualizarCalculo;
    inFuncG.options.onChange = actualizarCalculo;
    limA.options.onChange = actualizarCalculo;
    limB.options.onChange = actualizarCalculo;
    sliderTanX.options.onInput = actualizarCalculo;

    // =========================================================================
    // 3. MÓDULO REGRESIÓN POLINÓMICA
    // =========================================================================
    const regSlot = document.getElementById("reg-controls-slot");
    const panelReg = new GiovanniContainerSimple({ title: "Controles de Regresión", isOpen: true, width: "100%" });

    const inPoints = new GiovanniInputText({
        label: "Puntos (x,y)",
        value: "(1, 1.2), (2, 3.8), (3, 8.9), (4, 16.2), (5, 24.8)"
    });
    panelReg.appendChild(inPoints.element);

    const degReg = new GiovanniInputNumber({ label: "Grado Polinomio", min: 1, max: 5, step: 1, value: 2 });
    panelReg.appendChild(degReg.element);

    const inEvalX = new GiovanniInputNumber({ label: "Calcular y para x =", value: 6, step: 0.5 });
    panelReg.appendChild(inEvalX.element);

    const resReg = document.createElement("div");
    resReg.className = "math-result-card";
    panelReg.appendChild(resReg);

    regSlot.appendChild(panelReg.element);

    function actualizarRegresion() {
        const text = inPoints.getValue();
        const degree = degReg.getValue();
        const evalX = inEvalX.getValue();

        const pts = [];
        const regex = /\(([^,]+),\s*([^)]+)\)/g;
        let match;
        while ((match = regex.exec(text)) !== null) {
            const x = parseFloat(match[1]);
            const y = parseFloat(match[2]);
            if (!isNaN(x) && !isNaN(y)) pts.push({ x, y });
        }

        if (pts.length < degree + 1) {
            resReg.innerHTML = `<span style="color:#ef4444">Se requieren al menos ${degree + 1} puntos para grado ${degree}.</span>`;
            return;
        }

        const X = [], Y = [];
        for (let i = 0; i <= degree; i++) {
            X[i] = [];
            for (let j = 0; j <= degree; j++) {
                X[i][j] = pts.reduce((sum, p) => sum + Math.pow(p.x, i + j), 0);
            }
            Y[i] = pts.reduce((sum, p) => sum + p.y * Math.pow(p.x, i), 0);
        }

        let coeffs = [];
        try {
            coeffs = math.lusolve(X, Y).map(c => c[0]);
        } catch(e) {
            resReg.innerHTML = `<span style="color:#ef4444">Error al resolver mínimos cuadrados.</span>`;
            return;
        }

        let eqStr = "y = ";
        for (let i = degree; i >= 0; i--) {
            const val = coeffs[i];
            const sign = val >= 0 ? (i === degree ? "" : " + ") : " - ";
            const absV = Math.abs(val).toFixed(4);
            if (i > 1) eqStr += `${sign}${absV}x^${i}`;
            else if (i === 1) eqStr += `${sign}${absV}x`;
            else eqStr += `${sign}${absV}`;
        }

        // Predicción para evalX
        const predY = coeffs.reduce((acc, c, idx) => acc + c * Math.pow(evalX, idx), 0);

        // Coeficiente R²
        const yAvg = pts.reduce((s, p) => s + p.y, 0) / pts.length;
        let ssTot = 0, ssRes = 0;
        pts.forEach(p => {
            const yP = coeffs.reduce((acc, c, idx) => acc + c * Math.pow(p.x, idx), 0);
            ssTot += (p.y - yAvg)**2;
            ssRes += (p.y - yP)**2;
        });
        const r2 = ssTot > 0 ? (1 - (ssRes / ssTot)) : 1;

        resReg.innerHTML = `
            • <b>Ajuste</b>: ${eqStr}<br>
            • <b>Bondad R²</b>: ${r2.toFixed(5)} (${(r2*100).toFixed(2)}%)<br>
            • <b>Estimación f(${evalX})</b>: y = <b>${predY.toFixed(4)}</b>
        `;

        const xVals = pts.map(p => p.x);
        const minX = Math.min(...xVals, evalX) - 1;
        const maxX = Math.max(...xVals, evalX) + 1;
        const curveX = [], curveY = [];
        const steps = 200;
        for (let i = 0; i <= steps; i++) {
            const cx = minX + (i * (maxX - minX) / steps);
            curveX.push(cx);
            curveY.push(coeffs.reduce((acc, c, idx) => acc + c * Math.pow(cx, idx), 0));
        }

        const traces = [
            { x: pts.map(p => p.x), y: pts.map(p => p.y), mode: 'markers', name: 'Datos Experimentales', marker: { size: 9, color: '#ef4444' } },
            { x: curveX, y: curveY, mode: 'lines', name: 'Curva de Regresión', line: { color: '#3b82f6', width: 2 } },
            { x: [evalX], y: [predY], mode: 'markers', name: `f(${evalX})`, marker: { size: 10, color: '#10b981', symbol: 'diamond' } }
        ];

        const layout = {
            paper_bgcolor: '#242424',
            plot_bgcolor: '#242424',
            xaxis: { color: '#888', gridcolor: '#353535' },
            yaxis: { color: '#888', gridcolor: '#353535' },
            margin: { l: 40, r: 20, b: 30, t: 20 },
            legend: { font: { color: '#ccc' }, orientation: 'h' }
        };

        Plotly.react("plot-regression-2d", traces, layout, { responsive: true });
    }

    inPoints.options.onChange = actualizarRegresion;
    degReg.options.onChange = actualizarRegresion;
    inEvalX.options.onChange = actualizarRegresion;

    // =========================================================================
    // 4. MÓDULO SUPERFICIES 3D
    // =========================================================================
    const surfSlot = document.getElementById("surf-controls-slot");
    const panelSurf = new GiovanniContainerSimple({ title: "Controles Superficie 3D", isOpen: true, width: "100%" });

    const inSurf = new GiovanniInputText({ label: "Ecuación z = f(x, y)", value: "sin(sqrt(x^2 + y^2))" });
    panelSurf.appendChild(inSurf.element);

    const sliderRange = new GiovanniSlider({ label: "Radio de Dominio [-L, L]", min: 2, max: 12, step: 0.5, value: 5 });
    panelSurf.appendChild(sliderRange.element);

    surfSlot.appendChild(panelSurf.element);

    function actualizarSuperficie() {
        const eq = inSurf.getValue();
        const L = sliderRange.getValue();
        const steps = 30;
        const h = (2 * L) / steps;

        const xArr = [], yArr = [], zArr = [];
        for (let i = 0; i <= steps; i++) {
            xArr.push(-L + i * h);
            yArr.push(-L + i * h);
        }

        for (let i = 0; i <= steps; i++) {
            const row = [];
            const y = yArr[i];
            for (let j = 0; j <= steps; j++) {
                const x = xArr[j];
                try {
                    const z = math.evaluate(eq, { x, y });
                    row.push(isFinite(z) ? z : null);
                } catch(e) {
                    row.push(null);
                }
            }
            zArr.push(row);
        }

        const data = [{
            z: zArr, x: xArr, y: yArr,
            type: 'surface',
            colorscale: 'Viridis',
            showscale: false
        }];

        const layout = {
            paper_bgcolor: '#242424',
            plot_bgcolor: '#242424',
            scene: {
                xaxis: { title: 'X', color: '#888', gridcolor: '#444' },
                yaxis: { title: 'Y', color: '#888', gridcolor: '#444' },
                zaxis: { title: 'Z', color: '#888', gridcolor: '#444' }
            },
            margin: { l: 0, r: 0, b: 0, t: 10 }
        };

        Plotly.react("plot-superficie-3d", data, layout, { responsive: true });
    }

    inSurf.options.onChange = actualizarSuperficie;
    sliderRange.options.onInput = actualizarSuperficie;

    // Inicialización
    setTimeout(() => {
        actualizarVectores();
        actualizarCalculo();
        actualizarRegresion();
        actualizarSuperficie();
    }, 150);

    // Ajuste de tamaño en TV, PC o rotación de Tablet/Móvil
    window.addEventListener("resize", () => {
        Plotly.Plots.resize(document.getElementById("plot-vectorial-3d"));
        Plotly.Plots.resize(document.getElementById("plot-calculo-2d"));
        Plotly.Plots.resize(document.getElementById("plot-regression-2d"));
        Plotly.Plots.resize(document.getElementById("plot-superficie-3d"));
    });
});
</script>
