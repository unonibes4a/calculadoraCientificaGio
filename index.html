<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MathStudio Pro HD - Entorno Matemático & Físico Completo</title>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/mathjs/11.8.0/math.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/plotly.js/2.18.2/plotly.min.js"></script>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />

    <script src="https://unonibes4a.github.io/pintaresta/aggio.js"></script>

    <style>
        :root {
            --bg-main: #141414;
            --bg-panel: #202020;
            --accent: #5c9ce6;
            --border: #303030;
            --text: #e0e0e0;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: var(--bg-main);
            color: var(--text);
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            height: 100vh;
            width: 100vw;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        #app-tab-header {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 16px;
            background: #1a1a1a;
            border-bottom: 1px solid var(--border);
            overflow-x: auto;
            flex-shrink: 0;
        }
        #app-tab-header::-webkit-scrollbar { height: 4px; }

        .app-brand {
            font-size: 14px;
            font-weight: 700;
            color: var(--accent);
            white-space: nowrap;
            margin-right: 12px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        #app-workspace {
            flex: 1;
            position: relative;
            overflow-y: auto;
            padding: 16px;
            width: 100%;
            height: 100%;
        }

        .module-view {
            display: none;
            width: 100%;
            height: 100%;
        }

        .module-view.active {
            display: grid;
            gap: 16px;
            grid-template-columns: minmax(390px, 460px) 1fr;
            height: calc(100vh - 85px);
        }

        @media (max-width: 980px) {
            body { overflow-y: auto; height: auto; }
            #app-workspace { overflow-y: visible; height: auto; }
            .module-view.active { display: flex; flex-direction: column; height: auto; }
            .module-graph-box { min-height: 480px !important; height: 550px !important; }
        }

        .module-controls-box {
            display: flex;
            flex-direction: column;
            gap: 10px;
            overflow-y: auto;
            padding-right: 6px;
        }

        .module-graph-box {
            background: var(--bg-panel);
            border: 1px solid var(--border);
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            width: 100%;
            height: 100%;
            min-height: 450px;
            position: relative;
        }

        .graph-plotly-target {
            width: 100%;
            height: 100%;
            flex: 1;
        }

        .math-result-card {
            background: #181818;
            border-left: 3px solid var(--accent);
            padding: 10px 14px;
            border-radius: 0 6px 6px 0;
            font-size: 13px;
            line-height: 1.6;
            color: #dcdcdc;
            font-family: Consolas, monospace;
        }

        .math-row { display: flex; gap: 8px; align-items: center; width: 100%; }
        .math-row > * { flex: 1; }

        .math-tag {
            font-size: 11px;
            padding: 2px 6px;
            border-radius: 4px;
            background: rgba(92, 156, 230, 0.18);
            color: var(--accent);
            font-weight: 600;
        }

        .code-preview-box {
            background: #111111;
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 10px;
            font-family: 'Consolas', 'Fira Code', monospace;
            font-size: 11px;
            color: #9cdcfe;
            max-height: 220px;
            overflow-y: auto;
            white-space: pre;
            line-height: 1.45;
            user-select: text;
        }
    </style>
</head>
<body>

    <header id="app-tab-header">
        <div class="app-brand">
            <span class="material-symbols-outlined">biotech</span>
            <span>OmniMath & Physics Studio Pro</span>
        </div>
        <div id="tab-buttons-mount" style="display: flex; gap: 8px;"></div>
    </header>

    <main id="app-workspace"></main>

<script>
function safePlot(div, data, layout) {
    if (!div || div.clientWidth < 10 || div.clientHeight < 10) return;
    try {
        Plotly.react(div, data, layout, { responsive: true, displayModeBar: false });
    } catch (err) {
        try {
            Plotly.purge(div);
            Plotly.newPlot(div, data, layout, { responsive: true, displayModeBar: false });
        } catch(e) {}
    }
}

function sanitizeMathExpression(expr) {
    if (!expr || typeof expr !== 'string') return "0";
    let s = expr.trim();
    s = s.replace(/(\d)\s*([a-zA-Z(])/g, '$1*$2');
    s = s.replace(/([a-zA-Z])\s+([a-zA-Z])/g, '$1*$2');
    return s;
}

class MathUI {
    constructor() {
        this.headerMount = document.getElementById("tab-buttons-mount");
        this.workspaceMount = document.getElementById("app-workspace");
        this.modules = [];
        this.buttons = [];
        this.activeModuleId = null;

        let resizeTimer = null;
        window.addEventListener("resize", () => {
            clearTimeout(resizeTimer);
            resizeTimer = setTimeout(() => this.handleGlobalResize(), 100);
        });
    }

    registerModule(id, label, iconSvg, moduleInstance) {
        const section = document.createElement("section");
        section.id = `view-${id}`;
        section.className = "module-view";

        const controlsCol = document.createElement("div");
        controlsCol.className = "module-controls-box";

        const graphCol = document.createElement("div");
        graphCol.className = "module-graph-box";

        const plotDiv = document.createElement("div");
        plotDiv.id = `plot-${id}`;
        plotDiv.className = "graph-plotly-target";
        graphCol.appendChild(plotDiv);

        section.appendChild(controlsCol);
        section.appendChild(graphCol);
        this.workspaceMount.appendChild(section);

        const tabBtn = new GiovanniBoton({
            svg: iconSvg,
            texto: label,
            ancho: 170,
            alto: 34,
            position: "static",
            background: "#242424",
            color: "#9e9e9e",
            onClick: () => this.switchTab(id)
        });
        tabBtn.el.style.width = "auto";
        tabBtn.el.style.padding = "0 12px";
        tabBtn.el.style.gap = "6px";
        tabBtn._moduleId = id;
        tabBtn.montar(this.headerMount);
        this.buttons.push(tabBtn);

        moduleInstance.init(controlsCol, plotDiv);
        this.modules.push({ id, section, plotDiv, instance: moduleInstance });

        if (this.modules.length === 1) {
            this.switchTab(id);
        }
    }

    switchTab(moduleId) {
        this.activeModuleId = moduleId;

        this.modules.forEach(m => {
            const isActive = (m.id === moduleId);
            m.section.classList.toggle("active", isActive);
        });

        this.buttons.forEach(btn => {
            const isActive = (btn._moduleId === moduleId);
            btn.setStyle({
                backgroundColor: isActive ? "#5c9ce6" : "#242424",
                color: isActive ? "#ffffff" : "#9e9e9e"
            });
        });

        requestAnimationFrame(() => {
            requestAnimationFrame(() => {
                const current = this.modules.find(m => m.id === moduleId);
                if (current && current.instance && current.instance.render) {
                    current.instance.render();
                }
                this.handleGlobalResize();
            });
        });
    }

    handleGlobalResize() {
        const active = this.modules.find(m => m.id === this.activeModuleId);
        if (active && active.plotDiv && active.plotDiv.clientWidth > 10 && active.plotDiv.clientHeight > 10) {
            Plotly.Plots.resize(active.plotDiv);
        }
    }
}

class TrigonometriaModule {
    init(controlsContainer, plotElement) {
        this.plotEl = plotElement;
        this.panel = new GiovanniContainerSimple({
            title: "Trigonometría & Triángulo Rectángulo",
            isOpen: true,
            width: "100%"
        });

        const row = document.createElement("div");
        row.className = "math-row";
        this.inCatA = new GiovanniInputNumber({ label: "Cateto a (Base)", value: 4, step: 0.5 });
        this.inCatB = new GiovanniInputNumber({ label: "Cateto b (Altura)", value: 3, step: 0.5 });
        row.appendChild(this.inCatA.element);
        row.appendChild(this.inCatB.element);
        this.panel.appendChild(row);

        this.resCard = document.createElement("div");
        this.resCard.className = "math-result-card";
        this.panel.appendChild(this.resCard);

        controlsContainer.appendChild(this.panel.element);

        this.inCatA.options.onChange = () => this.render();
        this.inCatB.options.onChange = () => this.render();
    }

    render() {
        if (!this.plotEl || this.plotEl.clientWidth < 10) return;

        const a = Math.max(0.001, this.inCatA.getValue());
        const b = Math.max(0.001, this.inCatB.getValue());
        const c = Math.hypot(a, b);

        const alphaRad = Math.atan2(b, a);
        const betaRad = Math.atan2(a, b);
        const alphaDeg = (alphaRad * 180) / Math.PI;
        const betaDeg = (betaRad * 180) / Math.PI;

        const sinA = b / c;
        const cosA = a / c;
        const tanA = b / a;
        const secA = c / a;
        const cscA = c / b;
        const cotA = a / b;

        const area = (a * b) / 2;
        const perimeter = a + b + c;
        const hC = (a * b) / c;

        this.resCard.innerHTML = `
            • <b>Teorema de Pitágoras:</b> c = √(a² + b²) = √(${Math.pow(a,2).toFixed(2)} + ${Math.pow(b,2).toFixed(2)})<br>
            • <b>Hipotenusa (c):</b> ${c.toFixed(4)} u<br>
            • <b>Ángulo α:</b> ${alphaDeg.toFixed(3)}° (${alphaRad.toFixed(4)} rad)<br>
            • <b>Ángulo β:</b> ${betaDeg.toFixed(3)}° (${betaRad.toFixed(4)} rad)<br>
            • <b>Ángulo γ:</b> 90.000° (Ángulo Recto)<br>
            • <b>Suma de Ángulos:</b> ${(alphaDeg + betaDeg + 90).toFixed(2)}°<br><br>
            • <b>Razones de α:</b> sen(α)=${sinA.toFixed(4)} | cos(α)=${cosA.toFixed(4)} | tan(α)=${tanA.toFixed(4)}<br>
            • <b>Recíprocas:</b> csc(α)=${cscA.toFixed(4)} | sec(α)=${secA.toFixed(4)} | cot(α)=${cotA.toFixed(4)}<br><br>
            • <b>Área Geométrica:</b> ${area.toFixed(4)} u² | <b>Perímetro:</b> ${perimeter.toFixed(4)} u<br>
            • <b>Altura Relativa (h_c):</b> ${hC.toFixed(4)} u
        `;

        const sq = Math.min(a, b) * 0.12;
        const arcR = Math.min(a, b) * 0.28;
        const arcX = [];
        const arcY = [];
        const steps = 30;
        for (let i = 0; i <= steps; i++) {
            const th = (alphaRad / steps) * i;
            arcX.push(arcR * Math.cos(th));
            arcY.push(arcR * Math.sin(th));
        }

        const traces = [
            {
                x: [0, a, a, 0],
                y: [0, 0, b, 0],
                fill: 'toself',
                fillcolor: 'rgba(92, 156, 230, 0.18)',
                line: { color: '#5c9ce6', width: 3 },
                mode: 'lines+markers+text',
                text: ['A (0,0)', 'C (a,0)', 'B (a,b)', ''],
                textposition: ['bottom left', 'bottom right', 'top right', 'center'],
                name: 'Triángulo'
            },
            {
                x: [a - sq, a - sq, a],
                y: [0, sq, sq],
                mode: 'lines',
                line: { color: '#ef4444', width: 2 },
                name: '90°'
            },
            {
                x: [0, ...arcX, 0],
                y: [0, ...arcY, 0],
                mode: 'lines',
                fill: 'toself',
                fillcolor: 'rgba(245, 158, 11, 0.25)',
                line: { color: '#f59e0b', width: 1.5 },
                name: `α (${alphaDeg.toFixed(1)}°)`
            }
        ];

        const layout = {
            paper_bgcolor: '#202020',
            plot_bgcolor: '#202020',
            xaxis: {
                title: 'Cateto a (Base)',
                color: '#888',
                gridcolor: '#303030',
                range: [-a * 0.15, a * 1.25]
            },
            yaxis: {
                title: 'Cateto b (Altura)',
                color: '#888',
                gridcolor: '#303030',
                range: [-b * 0.15, b * 1.25],
                scaleanchor: 'x',
                scaleratio: 1
            },
            annotations: [
                { x: a / 2, y: -b * 0.08, text: `a = ${a.toFixed(2)}`, showarrow: false, font: { color: '#5c9ce6' } },
                { x: a + a * 0.08, y: b / 2, text: `b = ${b.toFixed(2)}`, showarrow: false, font: { color: '#10b981' } },
                { x: a / 2 - a * 0.08, y: b / 2 + b * 0.08, text: `c = ${c.toFixed(2)}`, showarrow: false, font: { color: '#ef4444' } }
            ],
            margin: { l: 45, r: 20, b: 40, t: 20 },
            legend: { font: { color: '#ccc' }, orientation: 'h' }
        };

        safePlot(this.plotEl, traces, layout);
    }
}

class AritmeticaAlgebraModule {
    init(controlsContainer, plotElement) {
        this.plotEl = plotElement;
        this.panel = new GiovanniContainerSimple({
            title: "Aritmética, Álgebra & Números Complejos",
            isOpen: true,
            width: "100%"
        });

        const lbl1 = document.createElement("div"); lbl1.innerHTML = `<span class="math-tag">Complejo z₁ = a + bi</span>`; this.panel.appendChild(lbl1);
        const rowZ1 = document.createElement("div"); rowZ1.className = "math-row";
        this.re1 = new GiovanniInputNumber({ label: "Re(z₁)", value: 3, step: 0.5 });
        this.im1 = new GiovanniInputNumber({ label: "Im(z₁)", value: 4, step: 0.5 });
        rowZ1.appendChild(this.re1.element); rowZ1.appendChild(this.im1.element);
        this.panel.appendChild(rowZ1);

        const lbl2 = document.createElement("div"); lbl2.innerHTML = `<span class="math-tag">Complejo z₂ = c + di</span>`; this.panel.appendChild(lbl2);
        const rowZ2 = document.createElement("div"); rowZ2.className = "math-row";
        this.re2 = new GiovanniInputNumber({ label: "Re(z₂)", value: 1, step: 0.5 });
        this.im2 = new GiovanniInputNumber({ label: "Im(z₂)", value: -2, step: 0.5 });
        rowZ2.appendChild(this.re2.element); rowZ2.appendChild(this.im2.element);
        this.panel.appendChild(rowZ2);

        this.resCard = document.createElement("div");
        this.resCard.className = "math-result-card";
        this.panel.appendChild(this.resCard);

        controlsContainer.appendChild(this.panel.element);

        [this.re1, this.im1, this.re2, this.im2].forEach(c => c.options.onChange = () => this.render());
    }

    render() {
        if (!this.plotEl || this.plotEl.clientWidth < 10) return;

        const a = this.re1.getValue();
        const b = this.im1.getValue();
        const c = this.re2.getValue();
        const d = this.im2.getValue();

        const sumR = a + c;
        const sumI = b + d;

        const subR = a - c;
        const subI = b - d;

        const mulR = a * c - b * d;
        const mulI = a * d + b * c;

        const den = c * c + d * d;
        const divR = den !== 0 ? (a * c + b * d) / den : 0;
        const divI = den !== 0 ? (b * c - a * d) / den : 0;

        const mod1 = Math.hypot(a, b);
        const arg1 = (Math.atan2(b, a) * 180) / Math.PI;

        const mod2 = Math.hypot(c, d);
        const arg2 = (Math.atan2(d, c) * 180) / Math.PI;

        this.resCard.innerHTML = `
            • <b>z₁:</b> ${a} + ${b}i | |z₁| = ${mod1.toFixed(3)} | θ₁ = ${arg1.toFixed(2)}°<br>
            • <b>z₂:</b> ${c} + ${d}i | |z₂| = ${mod2.toFixed(3)} | θ₂ = ${arg2.toFixed(2)}°<br>
            • <b>Suma (z₁ + z₂):</b> ${sumR.toFixed(3)} + ${sumI.toFixed(3)}i<br>
            • <b>Resta (z₁ - z₂):</b> ${subR.toFixed(3)} + ${subI.toFixed(3)}i<br>
            • <b>Producto (z₁ · z₂):</b> ${mulR.toFixed(3)} + ${mulI.toFixed(3)}i<br>
            • <b>División (z₁ / z₂):</b> ${den !== 0 ? `${divR.toFixed(3)} + ${divI.toFixed(3)}i` : "Indefinida"}<br>
            • <b>Conjugados:</b> z̄₁ = ${a} - ${b}i | z̄₂ = ${c} - ${d}i
        `;

        const traces = [
            {
                x: [0, a], y: [0, b],
                mode: 'lines+markers',
                name: 'z₁',
                line: { color: '#3b82f6', width: 3 },
                marker: { size: [0, 8], color: '#3b82f6' }
            },
            {
                x: [0, c], y: [0, d],
                mode: 'lines+markers',
                name: 'z₂',
                line: { color: '#10b981', width: 3 },
                marker: { size: [0, 8], color: '#10b981' }
            },
            {
                x: [0, sumR], y: [0, sumI],
                mode: 'lines+markers',
                name: 'z₁ + z₂',
                line: { color: '#f59e0b', width: 2.5, dash: 'dash' },
                marker: { size: [0, 8], color: '#f59e0b' }
            },
            {
                x: [0, mulR], y: [0, mulI],
                mode: 'lines+markers',
                name: 'z₁ · z₂',
                line: { color: '#ec4899', width: 2, dash: 'dot' },
                marker: { size: [0, 8], color: '#ec4899' }
            }
        ];

        const maxLim = Math.max(5, Math.abs(a), Math.abs(b), Math.abs(c), Math.abs(d), Math.abs(sumR), Math.abs(sumI)) * 1.3;

        const layout = {
            paper_bgcolor: '#202020',
            plot_bgcolor: '#202020',
            xaxis: {
                title: 'Eje Real Re(z)',
                color: '#888',
                gridcolor: '#303030',
                zerolinecolor: '#444',
                range: [-maxLim, maxLim]
            },
            yaxis: {
                title: 'Eje Imaginario Im(z)',
                color: '#888',
                gridcolor: '#303030',
                zerolinecolor: '#444',
                range: [-maxLim, maxLim],
                scaleanchor: 'x',
                scaleratio: 1
            },
            margin: { l: 45, r: 20, b: 40, t: 20 },
            legend: { font: { color: '#ccc' }, orientation: 'h' }
        };

        safePlot(this.plotEl, traces, layout);
    }
}

class MatricesModule {
    init(controlsContainer, plotElement) {
        this.plotEl = plotElement;
        this.panel = new GiovanniContainerSimple({
            title: "Álgebra Lineal & Transformaciones 2D",
            isOpen: true,
            width: "100%"
        });

        const row1 = document.createElement("div"); row1.className = "math-row";
        this.m11 = new GiovanniInputNumber({ label: "A₁₁", value: 2, step: 0.2 });
        this.m12 = new GiovanniInputNumber({ label: "A₁₂", value: 1, step: 0.2 });
        row1.appendChild(this.m11.element); row1.appendChild(this.m12.element);
        this.panel.appendChild(row1);

        const row2 = document.createElement("div"); row2.className = "math-row";
        this.m21 = new GiovanniInputNumber({ label: "A₂₁", value: 0.5, step: 0.2 });
        this.m22 = new GiovanniInputNumber({ label: "A₂₂", value: 1.5, step: 0.2 });
        row2.appendChild(this.m21.element); row2.appendChild(this.m22.element);
        this.panel.appendChild(row2);

        this.resCard = document.createElement("div");
        this.resCard.className = "math-result-card";
        this.panel.appendChild(this.resCard);

        controlsContainer.appendChild(this.panel.element);

        [this.m11, this.m12, this.m21, this.m22].forEach(c => c.options.onChange = () => this.render());
    }

    render() {
        if (!this.plotEl || this.plotEl.clientWidth < 10) return;

        const a = this.m11.getValue();
        const b = this.m12.getValue();
        const c = this.m21.getValue();
        const d = this.m22.getValue();

        const det = a * d - b * c;
        const trace = a + d;
        const disc = trace * trace - 4 * det;

        let eigenText = "";
        if (disc >= 0) {
            const l1 = (trace + Math.sqrt(disc)) / 2;
            const l2 = (trace - Math.sqrt(disc)) / 2;
            eigenText = `λ₁ = ${l1.toFixed(4)}, λ₂ = ${l2.toFixed(4)}`;
        } else {
            const re = (trace / 2).toFixed(4);
            const im = (Math.sqrt(-disc) / 2).toFixed(4);
            eigenText = `λ = ${re} ± ${im}i`;
        }

        let invText = "Singular (No invertible)";
        if (Math.abs(det) > 1e-9) {
            invText = `[[${(d/det).toFixed(2)}, ${(-b/det).toFixed(2)}], [${(-c/det).toFixed(2)}, ${(a/det).toFixed(2)}]]`;
        }

        this.resCard.innerHTML = `
            • <b>Determinante det(A):</b> ${det.toFixed(4)}<br>
            • <b>Traza tr(A):</b> ${trace.toFixed(4)}<br>
            • <b>Autovalores:</b> ${eigenText}<br>
            • <b>Matriz Inversa A⁻¹:</b> ${invText}<br>
            • <b>Escalado de Área:</b> |det(A)| = ${Math.abs(det).toFixed(4)}
        `;

        const sqX = [0, 1, 1, 0, 0];
        const sqY = [0, 0, 1, 1, 0];
        const trX = [];
        const trY = [];

        for (let i = 0; i < sqX.length; i++) {
            trX.push(a * sqX[i] + b * sqY[i]);
            trY.push(c * sqX[i] + d * sqY[i]);
        }

        const traces = [
            {
                x: sqX, y: sqY,
                mode: 'lines',
                line: { color: '#888', width: 2, dash: 'dot' },
                fill: 'toself',
                fillcolor: 'rgba(150, 150, 150, 0.1)',
                name: 'Original'
            },
            {
                x: trX, y: trY,
                mode: 'lines+markers',
                line: { color: '#3878e0', width: 2.5 },
                fill: 'toself',
                fillcolor: 'rgba(168, 85, 247, 0.25)',
                name: 'T(Espacio)'
            },
            {
                x: [0, a], y: [0, c],
                mode: 'lines+markers',
                line: { color: '#3b82f6', width: 3.5 },
                name: 'T(î)'
            },
            {
                x: [0, b], y: [0, d],
                mode: 'lines+markers',
                line: { color: '#10b981', width: 3.5 },
                name: 'T(ĵ)'
            }
        ];

        const layout = {
            paper_bgcolor: '#202020',
            plot_bgcolor: '#202020',
            xaxis: { title: 'X', color: '#888', gridcolor: '#303030', zerolinecolor: '#444' },
            yaxis: { title: 'Y', color: '#888', gridcolor: '#303030', zerolinecolor: '#444', scaleanchor: 'x', scaleratio: 1 },
            margin: { l: 45, r: 20, b: 40, t: 20 },

class NewtonPhysicsModule {
    init(controlsContainer, plotElement) {
        this.plotEl = plotElement;
        this.panel = new GiovanniContainerSimple({
            title: "Física Clásica - Balística & Energía Mecánica",
            isOpen: true,
            width: "100%"
        });

        const row1 = document.createElement("div"); row1.className = "math-row";
        this.inVel = new GiovanniInputNumber({ label: "Velocidad v₀ (m/s)", value: 25, step: 1 });
        this.inAng = new GiovanniInputNumber({ label: "Ángulo θ (°)", value: 45, step: 1 });
        row1.appendChild(this.inVel.element); row1.appendChild(this.inAng.element);
        this.panel.appendChild(row1);

        const row2 = document.createElement("div"); row2.className = "math-row";
        this.inH = new GiovanniInputNumber({ label: "Altura y₀ (m)", value: 0, step: 1 });
        this.inM = new GiovanniInputNumber({ label: "Masa m (kg)", value: 2, step: 0.5 });
        this.inG = new GiovanniInputNumber({ label: "Gravedad g (m/s²)", value: 9.806, step: 0.1 });
        row2.appendChild(this.inH.element); row2.appendChild(this.inM.element); row2.appendChild(this.inG.element);
        this.panel.appendChild(row2);

        this.resCard = document.createElement("div");
        this.resCard.className = "math-result-card";
        this.panel.appendChild(this.resCard);

        controlsContainer.appendChild(this.panel.element);

        [this.inVel, this.inAng, this.inH, this.inM, this.inG].forEach(c => c.options.onChange = () => this.render());
    }

    render() {
        if (!this.plotEl || this.plotEl.clientWidth < 10) return;

        const v0 = this.inVel.getValue();
        const deg = this.inAng.getValue();
        const y0 = this.inH.getValue();
        const m = this.inM.getValue();
        const g = this.inG.getValue();

        const rad = (deg * Math.PI) / 180;
        const v0x = v0 * Math.cos(rad);
        const v0y = v0 * Math.sin(rad);

        const tVertex = v0y / g;
        const hMax = y0 + (v0y * v0y) / (2 * g);

        const disc = v0y * v0y + 2 * g * y0;
        const tFlight = (v0y + Math.sqrt(disc)) / g;
        const maxRange = v0x * tFlight;

        const ek0 = 0.5 * m * v0 * v0;
        const ep0 = m * g * y0;
        const eMech = ek0 + ep0;

        const vFinalY = v0y - g * tFlight;
        const vFinal = Math.hypot(v0x, vFinalY);

        this.resCard.innerHTML = `
            • <b>Componentes:</b> v₀x = ${v0x.toFixed(3)} m/s | v₀y = ${v0y.toFixed(3)} m/s<br>
            • <b>Tiempo de Vuelo Total:</b> ${tFlight.toFixed(3)} s (Vértice en ${tVertex.toFixed(3)} s)<br>
            • <b>Altura Máxima (H_max):</b> ${hMax.toFixed(3)} m<br>
            • <b>Alcance Máximo (X_max):</b> ${maxRange.toFixed(3)} m<br>
            • <b>Velocidad de Impacto:</b> ${vFinal.toFixed(3)} m/s<br><br>
            • <b>Energía Cinética Inicial (Ek):</b> ${ek0.toFixed(2)} J<br>
            • <b>Energía Potencial Inicial (Ep):</b> ${ep0.toFixed(2)} J<br>
            • <b>Energía Mecánica Total (E_mec):</b> ${eMech.toFixed(2)} J
        `;

        const trajX = [];
        const trajY = [];
        const steps = 150;
        const dt = tFlight / steps;

        for (let i = 0; i <= steps; i++) {
            const t = i * dt;
            const x = v0x * t;
            const y = y0 + v0y * t - 0.5 * g * t * t;
            trajX.push(x);
            trajY.push(Math.max(0, y));
        }

        const traces = [
            {
                x: trajX, y: trajY,
                mode: 'lines',
                line: { color: '#3b82f6', width: 3 },
                name: 'Trayectoria y(x)'
            },
            {
                x: [trajX[0]], y: [trajY[0]],
                mode: 'markers',
                marker: { size: 10, color: '#10b981' },
                name: 'Disparo'
            },
            {
                x: [trajX[trajX.length - 1]], y: [0],
                mode: 'markers',
                marker: { size: 10, color: '#ef4444' },
                name: 'Impacto'
            }
        ];

        const layout = {
            paper_bgcolor: '#202020',
            plot_bgcolor: '#202020',
            xaxis: { title: 'Distancia Horizontal X (m)', color: '#888', gridcolor: '#303030' },
            yaxis: { title: 'Altura Vertical Y (m)', color: '#888', gridcolor: '#303030' },
            margin: { l: 45, r: 20, b: 40, t: 20 },
            legend: { font: { color: '#ccc' }, orientation: 'h' }
        };

        safePlot(this.plotEl, traces, layout);
    }
}

class EinsteinPhysicsModule {
    init(controlsContainer, plotElement) {
        this.plotEl = plotElement;
        this.panel = new GiovanniContainerSimple({
            title: "Física Relativista - Transformaciones de Lorentz",
            isOpen: true,
            width: "100%"
        });

        this.sliderBeta = new GiovanniSlider({ label: "Velocidad β = v/c", min: 0.0, max: 0.999, step: 0.001, value: 0.6 });
        this.panel.appendChild(this.sliderBeta.element);

        const row = document.createElement("div"); row.className = "math-row";
        this.inMass0 = new GiovanniInputNumber({ label: "Masa m₀ (kg)", value: 1, step: 0.1 });
        this.inTime0 = new GiovanniInputNumber({ label: "Tiempo Δt₀ (s)", value: 10, step: 1 });
        this.inLen0 = new GiovanniInputNumber({ label: "Longitud L₀ (m)", value: 100, step: 5 });
        row.appendChild(this.inMass0.element); row.appendChild(this.inTime0.element); row.appendChild(this.inLen0.element);
        this.panel.appendChild(row);

        this.resCard = document.createElement("div");
        this.resCard.className = "math-result-card";
        this.panel.appendChild(this.resCard);

        controlsContainer.appendChild(this.panel.element);

        this.sliderBeta.options.onInput = () => this.render();
        [this.inMass0, this.inTime0, this.inLen0].forEach(c => c.options.onChange = () => this.render());
    }

    render() {
        if (!this.plotEl || this.plotEl.clientWidth < 10) return;

        const beta = Math.min(0.9999, Math.max(0, this.sliderBeta.getValue()));
        const m0 = this.inMass0.getValue();
        const t0 = this.inTime0.getValue();
        const l0 = this.inLen0.getValue();
        const c = 299792458;

        const gamma = 1 / Math.sqrt(1 - beta * beta);
        const tDilated = gamma * t0;
        const lContracted = l0 / gamma;
        const relMass = gamma * m0;

        const eRest = m0 * c * c;
        const eTotal = gamma * m0 * c * c;
        const eKinetic = (gamma - 1) * m0 * c * c;
        const momentum = gamma * m0 * (beta * c);

        this.resCard.innerHTML = `
            • <b>Factor de Lorentz (γ):</b> ${gamma.toFixed(5)}<br>
            • <b>Velocidad v:</b> ${(beta * 100).toFixed(2)}% c (${(beta * c).toExponential(3)} m/s)<br>
            • <b>Dilatación Temporal:</b> Δt = γ·Δt₀ = <b>${tDilated.toFixed(4)} s</b> (Δt₀ = ${t0} s)<br>
            • <b>Contracción de Longitud:</b> L = L₀/γ = <b>${lContracted.toFixed(4)} m</b> (L₀ = ${l0} m)<br>
            • <b>Masa Relativista:</b> m = γ·m₀ = <b>${relMass.toFixed(4)} kg</b><br>
            • <b>Momento Relativista (p):</b> ${momentum.toExponential(4)} kg·m/s<br><br>
            • <b>Energía en Reposo (E₀):</b> ${eRest.toExponential(4)} J<br>
            • <b>Energía Cinética (Ek):</b> ${eKinetic.toExponential(4)} J<br>
            • <b>Energía Total (E = γm₀c²):</b> ${eTotal.toExponential(4)} J
        `;

        const betaArr = [];
        const gammaArr = [];
        for (let b = 0; b <= 0.985; b += 0.005) {
            betaArr.push(b);
            gammaArr.push(1 / Math.sqrt(1 - b * b));
        }

        const traces = [
            {
                x: betaArr, y: gammaArr,
                mode: 'lines',
                line: { color: '#3878e0', width: 2.5 },
                name: 'Factor γ(β)'
            },
            {
                x: [beta], y: [gamma],
                mode: 'markers',
                marker: { size: 10, color: '#f59e0b' },
                name: `Estado Actual (β=${beta.toFixed(3)}, γ=${gamma.toFixed(2)})`
            }
        ];

        const layout = {
            paper_bgcolor: '#202020',
            plot_bgcolor: '#202020',
            xaxis: { title: 'Velocidad Relativa β = v/c', color: '#888', gridcolor: '#303030' },
            yaxis: { title: 'Factor Relativista Gamma (γ)', color: '#888', gridcolor: '#303030', range: [1, 10] },
            margin: { l: 45, r: 20, b: 40, t: 20 },
            legend: { font: { color: '#ccc' }, orientation: 'h' }
        };

        safePlot(this.plotEl, traces, layout);
    }
}

        this.btnCopy = new GiovanniBoton({
            svg: iconCopy,

            ancho: 150,
            alto: 32,
            position: "static",

        });

        this.codePreview.className = "code-preview-box";

        const triggerUpdate = () => {
            clearTimeout(this.debounceTimer);
            this.debounceTimer = setTimeout(() => {
                this.render();
                this.generateCode();
            }, 200);
        };

        this.inEq.options.onChange = triggerUpdate;
        this.sliderRange.options.onInput = triggerUpdate;
        this.sliderRes.options.onInput = triggerUpdate;

        this.generateCode();
    }

    render() {
        if (!this.plotEl || this.plotEl.clientWidth < 10 || this.plotEl.clientHeight < 10) return;

        const rawEq = this.inEq.getValue();
        const cleanEq = sanitizeMathExpression(rawEq);
        const L = this.sliderRange.getValue();
        const steps = this.sliderRes.getValue();
        const h = (2 * L) / steps;

        let compiled = null;
        try {
            compiled = math.compile(cleanEq);
            const test = compiled.evaluate({ x: 1, y: 1 });
            if (typeof test !== 'number' || isNaN(test)) throw new Error();
        } catch (e) {
            this.resCard.innerHTML = `<span style="color:#f59e0b">Escribiendo fórmula... (Ej: x*y, sin(x)*cos(y), x^2 - y^2)</span>`;
            return;
        }

        const xArr = [], yArr = [], zArr = [];
        for (let i = 0; i <= steps; i++) {
            xArr.push(-L + i * h);
            yArr.push(-L + i * h);
        }

        let minZ = Infinity, maxZ = -Infinity;

        for (let i = 0; i <= steps; i++) {
            const row = [];
            const y = yArr[i];
            for (let j = 0; j <= steps; j++) {
                const x = xArr[j];
                let zVal = 0.0;
                try {
                    const r = compiled.evaluate({ x, y });
                    if (typeof r === 'number' && isFinite(r) && !isNaN(r)) {
                        zVal = r;
                    }
                } catch(err) {
                    zVal = 0.0;
                }
                if (zVal < minZ) minZ = zVal;
                if (zVal > maxZ) maxZ = zVal;
                row.push(zVal);
            }
            zArr.push(row);
        }

        if (minZ === Infinity || maxZ === -Infinity) {
            minZ = -1.0; maxZ = 1.0;
        } else if (Math.abs(maxZ - minZ) < 1e-4) {
            minZ -= 1.0;
            maxZ += 1.0;
        }

        const totalVerts = (steps + 1) * (steps + 1);
        const totalTris = steps * steps * 2;
        this.resCard.innerHTML = `
            • <b>Ecuación</b>: z = ${cleanEq}<br>
            • <b>Vértices</b>: ${totalVerts.toLocaleString()} | <b>Triángulos</b>: ${totalTris.toLocaleString()}<br>
            • <b>Rango Z</b>: [${minZ.toFixed(2)}, ${maxZ.toFixed(2)}] | <b>Dominio L</b>: ±${L}
        `;

        const data = [{
            z: zArr,
            x: xArr,
            y: yArr,
            type: 'surface',
            colorscale: 'Viridis',
            showscale: false
        }];

        const layout = {
            paper_bgcolor: '#202020',
            plot_bgcolor: '#202020',
            scene: {
                aspectmode: 'manual',
                aspectratio: { x: 1, y: 1, z: 0.5 },
                xaxis: { title: 'X', color: '#888', gridcolor: '#444' },
                yaxis: { title: 'Y', color: '#888', gridcolor: '#444' },
                zaxis: {
                    title: 'Z',
                    color: '#888',
                    gridcolor: '#444',
                    range: [minZ, maxZ]
                }
            },
            margin: { l: 0, r: 0, b: 0, t: 10 }
        };

        safePlot(this.plotEl, data, layout);
    }

    generateCode() {
        const engine = this.selectEngine.getValue();
        const rawEq = sanitizeMathExpression(this.inEq.getValue());
        const L = this.sliderRange.getValue();
        const steps = this.sliderRes.getValue();

        let code = "";
        switch (engine) {
            case "blender":
                this.currentExtension = ".py";
                code = this.getBlenderPythonCode(rawEq, L, steps);
                break;
            case "godot":
                this.currentExtension = ".gd";
                code = this.getGodotGDScriptCode(rawEq, L, steps);
                break;
            case "threejs":
                this.currentExtension = ".js";
                code = this.getThreeJsCode(rawEq, L, steps);
                break;
            case "unity":
                this.currentExtension = ".cs";
                code = this.getUnityCSharpCode(rawEq, L, steps);
                break;
            case "unreal":
                this.currentExtension = ".cpp";
                code = this.getUnrealCppCode(rawEq, L, steps);
                break;
            case "stride":
                this.currentExtension = ".cs";
                code = this.getStrideCSharpCode(rawEq, L, steps);
                break;
        }

        this.generatedCode = code;
        this.codePreview.textContent = code;
    }

    getBlenderPythonCode(eq, L, steps) {
        let pyEq = eq.replace(/\^/g, '**').replace(/sin\(/g, 'math.sin(').replace(/cos\(/g, 'math.cos(').replace(/sqrt\(/g, 'math.sqrt(');
        return `import bpy, math\n\ndef create_surface():\n    L = ${L}\n    steps = ${steps}\n    h = (2.0 * L) / steps\n    verts, faces = [], []\n    for i in range(steps + 1):\n        y = -L + i * h\n        for j in range(steps + 1):\n            x = -L + j * h\n            try: z = ${pyEq}\n            except: z = 0.0\n            verts.append((x, y, z))\n    for i in range(steps):\n        for j in range(steps):\n            v0 = i * (steps + 1) + j\n            faces.append((v0, v0 + 1, (i + 1) * (steps + 1) + j + 1, (i + 1) * (steps + 1) + j))\n    mesh = bpy.data.meshes.new("MathSurface")\n    mesh.from_pydata(verts, [], faces)\n    mesh.update()\n    obj = bpy.data.objects.new("MathSurfaceObj", mesh)\n    bpy.context.collection.objects.link(obj)\n\ncreate_surface()\n`;
    }

    getGodotGDScriptCode(eq, L, steps) {
        let gdEq = eq.replace(/\^/g, '**');
        return `@tool\nextends MeshInstance3D\n\n@export var L: float = ${L}\n@export var steps: int = ${steps}\n\nfunc _ready():\n    var st = SurfaceTool.new()\n    st.begin(Mesh.PRIMITIVE_TRIANGLES)\n    var h = (2.0 * L) / float(steps)\n    for i in range(steps):\n        var y0 = -L + float(i)*h\n        var y1 = y0 + h\n        for j in range(steps):\n            var x0 = -L + float(j)*h\n            var x1 = x0 + h\n            var p00 = Vector3(x0, ${gdEq.replace(/x/g, "x0").replace(/y/g, "y0")}, y0)\n            var p10 = Vector3(x1, ${gdEq.replace(/x/g, "x1").replace(/y/g, "y0")}, y0)\n            var p11 = Vector3(x1, ${gdEq.replace(/x/g, "x1").replace(/y/g, "y1")}, y1)\n            st.add_vertex(p00); st.add_vertex(p10); st.add_vertex(p11)\n    st.generate_normals()\n    mesh = st.commit()\n`;
    }

    getThreeJsCode(eq, L, steps) {
        let jsEq = eq.replace(/\^/g, '**').replace(/sin\(/g, 'Math.sin(').replace(/sqrt\(/g, 'Math.sqrt(');
        return `import * as THREE from 'three';\nexport function createSurface() {\n    const L = ${L}, seg = ${steps};\n    const geo = new THREE.PlaneGeometry(2*L, 2*L, seg, seg);\n    const pos = geo.attributes.position;\n    for (let i = 0; i < pos.count; i++) {\n        const x = pos.getX(i), y = pos.getY(i);\n        pos.setZ(i, ${jsEq});\n    }\n    geo.computeVertexNormals();\n    return new THREE.Mesh(geo, new THREE.MeshStandardMaterial({ color: 0x5c9ce6 }));\n}\n`;
    }

    getUnityCSharpCode(eq, L, steps) {
        let csEq = eq.replace(/x\^2/g, 'x*x').replace(/y\^2/g, 'y*y').replace(/sin\(/g, 'Mathf.Sin(').replace(/sqrt\(/g, 'Mathf.Sqrt(');
        return `using UnityEngine;\n[RequireComponent(typeof(MeshFilter), typeof(MeshRenderer))]\npublic class SurfaceGenerator : MonoBehaviour {\n    void Start() {\n        Mesh m = new Mesh();\n        int steps = ${steps}; float L = ${L}f, h = 2*L/steps;\n        Vector3[] v = new Vector3[(steps+1)*(steps+1)];\n        for (int i=0, y=0; y<=steps; y++) {\n            float yP = -L + y*h;\n            for (int x=0; x<=steps; x++, i++) {\n                float xP = -L + x*h;\n                v[i] = new Vector3(xP, ${csEq.replace(/x/g, "xP").replace(/y/g, "yP")}, yP);\n            }\n        }\n        m.vertices = v;\n        m.RecalculateNormals();\n        GetComponent<MeshFilter>().mesh = m;\n    }\n}\n`;
    }

    getUnrealCppCode(eq, L, steps) {
        return `#include "ProceduralMeshComponent.h"\nvoid GenerateMesh(UProceduralMeshComponent* P) {\n    TArray<FVector> V; TArray<int32> T;\n    // z = ${eq}\n}\n`;
    }

    getStrideCSharpCode(eq, L, steps) {
        return `using Stride.Graphics;\npublic static class MeshGen { /* z = ${eq} */ }\n`;
    }

    copyToClipboard() {
        navigator.clipboard.writeText(this.generatedCode).then(() => {
            const orig = this.btnCopy.texto;
            this.btnCopy.setTexto("¡Copiado!");
            this.btnCopy.setStyle({ color: "#10b981" });
            setTimeout(() => {
                this.btnCopy.setTexto(orig);
                this.btnCopy.setStyle({ color: "#6d6b6b" });
            }, 1800);
        });
    }

    downloadCodeFile() {
        const engine = this.selectEngine.getValue();
        const filename = `SurfaceMesh_${engine}${this.currentExtension}`;
        const blob = new Blob([this.generatedCode], { type: "text/plain;charset=utf-8" });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = filename;
        a.click();
        URL.revokeObjectURL(url);
    }
}

    render() {

        const u = [this.uX.getValue(), this.uY.getValue(), this.uZ.getValue()];
        const v = [this.vX.getValue(), this.vY.getValue(), this.vZ.getValue()];
        const magU = Math.hypot(...u), magV = Math.hypot(...v);
        const dot = u[0]*v[0] + u[1]*v[1] + u[2]*v[2];
        const angDeg = (magU > 0 && magV > 0) ? (Math.acos(Math.max(-1, Math.min(1, dot / (magU * magV)))) * 180 / Math.PI) : 0;
        const cross = [u[1]*v[2] - u[2]*v[1], u[2]*v[0] - u[0]*v[2], u[0]*v[1] - u[1]*v[0]];
        const proj = magV > 0 ? [(dot/magV**2)*v[0], (dot/magV**2)*v[1], (dot/magV**2)*v[2]] : [0,0,0];

        this.resCard.innerHTML = `

            • <b>Cruz (u × v)</b>: (${cross.map(n => n.toFixed(2)).join(', ')})<br>

        `;

            { type: 'scatter3d', mode: 'lines+markers', name: 'Vector V', x: [0, v[0]], y: [0, v[1]], z: [0, v[2]], line: { width: 8, color: '#10b981' }, marker: { size: [0,6], color: '#10b981' } }
        ];

        if (this.toggleCross.getValue() && Math.hypot(...cross) > 0) {
            traces.push({ type: 'scatter3d', mode: 'lines+markers', name: 'u × v', x: [0, cross[0]], y: [0, cross[1]], z: [0, cross[2]], line: { width: 8, color: '#f59e0b' }, marker: { size: [0,6], color: '#f59e0b' } });
        }
        if (this.toggleProj.getValue() && magV > 0) {
            traces.push({ type: 'scatter3d', mode: 'lines+markers', name: 'Proj_v(u)', x: [0, proj[0]], y: [0, proj[1]], z: [0, proj[2]], line: { width: 6, dash: 'dot', color: '#ec4899' }, marker: { size: [0,5], color: '#ec4899' } });
        }

        const layout = {
            paper_bgcolor: '#202020', plot_bgcolor: '#202020',
            scene: {

    }
}

        c.appendChild(this.panel.element);

        this.limB.options.onChange = () => this.render();
    }
    render() {
        if (!this.plotEl || this.plotEl.clientWidth < 10) return;
        const eqF = sanitizeMathExpression(this.inputF.getValue()), eqG = sanitizeMathExpression(this.inputG.getValue());
        const a = this.limA.getValue(), b = this.limB.getValue();
        const N = 200, h = (b - a) / N;
        let intF = 0, area = 0;
        const fillX = [], fillY1 = [], fillY2 = [];
        if (b > a) {
            for (let i = 0; i <= N; i++) {
                const cx = a + i * h;
                let y1 = 0, y2 = 0;
                try { y1 = math.evaluate(eqF, { x: cx }); } catch(e){}
                try { y2 = math.evaluate(eqG, { x: cx }); } catch(e){}
                fillX.push(cx); fillY1.push(y1); fillY2.push(y2);
                const w = (i === 0 || i === N) ? 0.5 : 1;
                intF += w * y1 * h; area += w * Math.abs(y1 - y2) * h;
            }
        }
        this.resCard.innerHTML = `• <b>∫ f(x) dx</b>: ${intF.toFixed(4)}<br>• <b>Área entre curvas</b>: ${area.toFixed(4)} u²`;
        const plotX = [], plotYF = [], plotYG = [];
        for (let i = 0; i <= 200; i++) {
            const x = (a - 2) + (i * ((b - a) + 4) / 200);
            plotX.push(x);
            try { plotYF.push(math.evaluate(eqF, { x })); } catch(e){ plotYF.push(null); }
            try { plotYG.push(math.evaluate(eqG, { x })); } catch(e){ plotYG.push(null); }
        }
        const traces = [
            { x: plotX, y: plotYF, mode: 'lines', name: 'f(x)', line: { color: '#3b82f6', width: 2 } },
            { x: plotX, y: plotYG, mode: 'lines', name: 'g(x)', line: { color: '#10b981', width: 2 } }
        ];
        if (fillX.length > 0) {
            traces.push({ x: [...fillX, ...fillX.slice().reverse()], y: [...fillY1, ...fillY2.slice().reverse()], fill: 'toself', fillcolor: 'rgba(92, 156, 230, 0.28)', line: { width: 0 }, name: 'Área' });
        }
        safePlot(this.plotEl, traces, { paper_bgcolor: '#202020', plot_bgcolor: '#202020', xaxis: { color: '#888', gridcolor: '#303030' }, yaxis: { color: '#888', gridcolor: '#303030' }, margin: { l: 40, r: 20, b: 30, t: 20 } });
    }
}

class RegresionPolinomicaModule {
    init(c, p) {
        this.plotEl = p;
        this.panel = new GiovanniContainerSimple({ title: "Regresión Polinómica & Mínimos Cuadrados", isOpen: true, width: "100%" });
        this.inPts = new GiovanniInputText({ label: "Puntos (x,y)", value: "(1, 2.1), (2, 4.2), (3, 8.8), (4, 16.5), (5, 26.0)" });
        this.degInput = new GiovanniInputNumber({ label: "Grado Polinomio (n)", min: 1, max: 5, step: 1, value: 2 });
        this.inEvalX = new GiovanniInputNumber({ label: "Predecir y en x =", value: 6, step: 0.5 });
        this.resCard = document.createElement("div"); this.resCard.className = "math-result-card";
        this.panel.appendChild(this.inPts.element);
        this.panel.appendChild(this.degInput.element);
        this.panel.appendChild(this.inEvalX.element);
        this.panel.appendChild(this.resCard);
        c.appendChild(this.panel.element);
        this.inPts.options.onChange = () => this.render();
        this.degInput.options.onChange = () => this.render();
        this.inEvalX.options.onChange = () => this.render();
    }
    render() {
        if (!this.plotEl || this.plotEl.clientWidth < 10) return;
        const text = this.inPts.getValue(), degree = Math.max(1, Math.min(5, Math.floor(this.degInput.getValue())));
        const evalX = this.inEvalX.getValue();
        const pts = []; const regex = /\(([^,]+),\s*([^)]+)\)/g; let m;
        while ((m = regex.exec(text)) !== null) {
            const x = parseFloat(m[1]), y = parseFloat(m[2]);
            if (!isNaN(x) && !isNaN(y)) pts.push({ x, y });
        }
        if (pts.length < degree + 1) {
            this.resCard.innerHTML = `<span style="color:#ef4444">Se requieren al menos ${degree + 1} puntos para grado ${degree}.</span>`;
            return;
        }
        const X = [], Y = [];
        for (let i = 0; i <= degree; i++) {
            X[i] = [];
            for (let j = 0; j <= degree; j++) X[i][j] = pts.reduce((s, p) => s + Math.pow(p.x, i + j), 0);
            Y[i] = pts.reduce((s, p) => s + p.y * Math.pow(p.x, i), 0);
        }
        let coeffs = [];
        try {
            coeffs = math.lusolve(X, Y).map(c => c[0]);
        } catch(e) {
            this.resCard.innerHTML = `<span style="color:#ef4444">Fallo al resolver matriz de mínimos cuadrados.</span>`;
            return;
        }
        let eqStr = "y = ";
        for (let i = degree; i >= 0; i--) {
            const val = coeffs[i];
            const sign = val >= 0 ? (i === degree ? "" : " + ") : " - ";
            const absV = Math.abs(val).toFixed(4);
            if (i > 1) eqStr += `${sign}${absV}x^${i}`;
            else if (i === 1) eqStr += `${sign}${absV}x`;
            else eqStr += `${sign}${absV}`;
        }
        const predY = coeffs.reduce((acc, c, idx) => acc + c * Math.pow(evalX, idx), 0);
        const yAvg = pts.reduce((s, p) => s + p.y, 0) / pts.length;
        let ssTot = 0, ssRes = 0;
        pts.forEach(p => {
            const yP = coeffs.reduce((acc, c, idx) => acc + c * Math.pow(p.x, idx), 0);
            ssTot += (p.y - yAvg)**2;
            ssRes += (p.y - yP)**2;
        });
        const r2 = ssTot > 0 ? (1 - (ssRes / ssTot)) : 1;
        this.resCard.innerHTML = `
            • <b>Ajuste Polinómico:</b> ${eqStr}<br>
            • <b>Bondad de Ajuste R²:</b> ${r2.toFixed(5)} (${(r2*100).toFixed(2)}%)<br>
            • <b>Suma Residual SS_res:</b> ${ssRes.toFixed(4)}<br>
            • <b>Predicción f(${evalX}):</b> y = <b>${predY.toFixed(4)}</b>
        `;
        const xVals = pts.map(p => p.x), minX = Math.min(...xVals, evalX) - 1.5, maxX = Math.max(...xVals, evalX) + 1.5;
        const curveX = [], curveY = [];
        for (let i = 0; i <= 180; i++) {
            const cx = minX + (i * (maxX - minX) / 180);
            curveX.push(cx);
            curveY.push(coeffs.reduce((acc, c, idx) => acc + c * Math.pow(cx, idx), 0));
        }
        const traces = [
            { x: pts.map(p => p.x), y: pts.map(p => p.y), mode: 'markers', name: 'Datos Experimentales', marker: { size: 8, color: '#ef4444' } },
            { x: curveX, y: curveY, mode: 'lines', name: 'Curva de Regresión', line: { color: '#3b82f6', width: 2.5 } },
            { x: [evalX], y: [predY], mode: 'markers', name: `P(${evalX})`, marker: { size: 10, color: '#10b981', symbol: 'diamond' } }
        ];
        safePlot(this.plotEl, traces, { paper_bgcolor: '#202020', plot_bgcolor: '#202020', xaxis: { color: '#888', gridcolor: '#303030' }, yaxis: { color: '#888', gridcolor: '#303030' }, margin: { l: 40, r: 20, b: 30, t: 20 } });
    }
}

        this.sliderT.options.onInput = () => this.render();
    }

                u**3*P0[1] + 3*u**2*tau*P1[1] + 3*u*tau**2*P2[1] + tau**3*P3[1]
            ];

        }

            { x: [P0[0], P1[0], P2[0], P3[0]], y: [P0[1], P1[1], P2[1], P3[1]], mode: 'lines+markers', name: 'Polígono', line: { dash: 'dot', color: '#888' }, marker: { size: 8, color: '#f59e0b' } },
            { x: curveX, y: curveY, mode: 'lines', name: 'Bézier', line: { color: '#3b82f6', width: 3 } },
            { x: [Pt[0]], y: [Pt[1]], mode: 'markers', name: 'B(t)', marker: { size: 10, color: '#ef4444' } }
        ];
        safePlot(this.plotEl, traces, { paper_bgcolor: '#202020', plot_bgcolor: '#202020', xaxis: { color: '#888', gridcolor: '#303030' }, yaxis: { color: '#888', gridcolor: '#303030' }, margin: { l: 40, r: 20, b: 30, t: 20 } });
    }
}
